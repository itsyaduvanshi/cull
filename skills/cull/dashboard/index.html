<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cull</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%23D4FF3F' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F7F7F4; --card: #FFFFFF; --sunk: #EFEFEA; --line: #E6E6E0; --line-2: #D9D9D2;
  --ink: #121212; --ink-2: #66665F; --ink-3: #9C9C94;
  --lime: #D4FF3F; --lime-ink: #121212; --mark: #D4FF3F;
  --dock: #121212; --dock-ink: #FAFAF7; --dock-2: #2A2A28;
  --sel: #3D7BFF;
  --shadow-1: 0 1px 2px rgba(20,20,10,.05), 0 4px 14px rgba(20,20,10,.05);
  --shadow-2: 0 18px 50px rgba(20,20,10,.16);
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --serif: "Newsreader", Georgia, serif;
  --tile: 180px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C0C0B; --card: #161615; --sunk: #1C1C1A; --line: #242422; --line-2: #31312E;
    --ink: #F3F3EE; --ink-2: #A3A39B; --ink-3: #6A6A63;
    --dock: #F3F3EE; --dock-ink: #121212; --dock-2: #DADAD3;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-2: 0 24px 60px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C0C0B; --card: #161615; --sunk: #1C1C1A; --line: #242422; --line-2: #31312E;
  --ink: #F3F3EE; --ink-2: #A3A39B; --ink-3: #6A6A63;
  --dock: #F3F3EE; --dock-ink: #121212; --dock-2: #DADAD3;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --shadow-2: 0 24px 60px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; transition: background-color .3s ease, color .3s ease; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); background: color-mix(in srgb, var(--paper) 78%, transparent); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 19px; letter-spacing: -.03em; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: #121212; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent); display: grid; place-items: center; transition: transform .5s var(--spring); }
.logo:hover i { transform: rotate(-10deg) scale(1.08); }
.logo i svg { width: 15px; height: 15px; }
.lib { font-size: 13px; color: var(--ink-2); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.search { position: relative; width: 300px; }
.search input { width: 100%; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); padding: 0 34px 0 36px; outline: none; transition: border-color .2s, box-shadow .2s; }
.search input:focus { border-color: var(--ink-3); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink) 7%, transparent); }
.search svg { position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; color: var(--ink-3); }
.search kbd { position: absolute; right: 9px; top: 9px; }
.iconbtn { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--card); transition: transform .15s, background .2s; }
.iconbtn:hover { background: var(--sunk); }
.iconbtn:active { transform: scale(.94); }
.iconbtn svg { width: 17px; height: 17px; }
.btn { height: 38px; padding: 0 15px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; transition: transform .15s, background .2s, box-shadow .2s; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn:active { transform: scale(.97); }
.btn.go { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.btn.go:hover { background: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--lime) 55%, transparent); }
.btn.go .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
kbd { font: 500 11px var(--mono); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--sunk); color: var(--ink-2); }

/* hero */
.hero { padding: 40px 0 8px; }
.hero h1 { font-size: clamp(38px, 6vw, 72px); line-height: .98; letter-spacing: -.045em; font-weight: 600; margin: 0; }
.hero h1 em { font-family: var(--serif); font-style: italic; font-weight: 500; letter-spacing: -.02em; position: relative; white-space: nowrap; }
.hero h1 em::after { content: ""; position: absolute; left: -.04em; right: -.06em; bottom: .08em; height: .26em; background: var(--mark); z-index: -1; border-radius: 3px; transform-origin: left; animation: swipe .9s .35s var(--ease) both; }
.hero h1 { position: relative; z-index: 0; }
@keyframes swipe { from { transform: scaleX(0); } }
.hero .sub { margin: 14px 0 0; color: var(--ink-2); font-size: 16px; }
.hero .sub b { color: var(--ink); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 28px; }
.stat { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 15px; transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; position: relative; overflow: hidden; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-1); }
.stat.on { border-color: var(--ink); }
.stat .n { font: 600 28px/1 var(--font); letter-spacing: -.04em; font-variant-numeric: tabular-nums; display: block; }
.stat .l { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--ink-3)); }

/* folders */
.folders { display: flex; gap: 12px; overflow-x: auto; padding: 26px 32px 20px; margin: 0 -32px; scroll-snap-type: x proximity; scrollbar-width: none; }
.folders::-webkit-scrollbar { display: none; }
.folder { display: block; align-self: flex-start; flex: none; width: 168px; scroll-snap-align: start; text-align: left; border-radius: 18px; padding: 12px; background: var(--card); border: 1px solid var(--line); transition: transform .3s var(--ease), box-shadow .3s, border-color .2s; position: relative; }
.folder:hover { transform: translateY(-3px); box-shadow: var(--shadow-1); }
.folder.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.folder.empty { opacity: .55; }
.folder.bump { animation: bump .5s var(--spring); }
@keyframes bump { 30% { transform: scale(1.06) translateY(-4px); } }
.fan { position: relative; height: 92px; margin-bottom: 12px; border-radius: 12px; background: var(--sunk); overflow: hidden; }
.fan img { position: absolute; width: 58px; height: 72px; object-fit: cover; border-radius: 8px; top: 12px; left: 50%; margin-left: -29px; box-shadow: 0 4px 12px rgba(0,0,0,.18); border: 2px solid var(--card); transition: transform .45s var(--spring); }
.fan img:nth-child(1) { transform: rotate(-9deg) translateX(-22px); }
.fan img:nth-child(2) { transform: rotate(7deg) translateX(22px); }
.fan img:nth-child(3) { transform: translateY(-2px); z-index: 2; }
.folder:hover .fan img:nth-child(1) { transform: rotate(-15deg) translateX(-36px) translateY(4px); }
.folder:hover .fan img:nth-child(2) { transform: rotate(13deg) translateX(36px) translateY(4px); }
.folder:hover .fan img:nth-child(3) { transform: translateY(-8px) scale(1.05); }
.fan .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
.fan .none svg { width: 26px; height: 26px; }
.folder .t { font-weight: 600; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; }
.folder .c { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.folder .k { position: absolute; right: 12px; bottom: 14px; }

/* toolbar */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 0 18px; }
.seg { display: inline-flex; position: relative; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; z-index: 1; height: 32px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: color .2s; }
.seg button.on { color: var(--ink); }
.seg button .cnt { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 12px; }
.seg .pill { position: absolute; z-index: 0; top: 3px; height: 32px; border-radius: 9px; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.05); transition: left .35s var(--ease), width .35s var(--ease); }
.chip-btn { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
.chip-btn:hover { color: var(--ink); border-color: var(--line-2); }
.chip-btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip-btn .cnt { font-size: 12px; opacity: .65; }
.sel-wrap { position: relative; }
.sel-wrap select { appearance: none; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 30px 0 12px; font-size: 13px; cursor: pointer; }
.sel-wrap::after { content: ""; position: absolute; right: 12px; top: 13px; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); pointer-events: none; }
.size { width: 90px; accent-color: var(--ink); }

/* notice */
.notice { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; animation: rise .5s var(--ease) both; }
.notice .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; flex: none; }
.notice .ic svg { width: 17px; height: 17px; }
.notice p { margin: 0; font-size: 14px; color: var(--ink-2); }
.notice b { color: var(--ink); }
.notice code { font: 12px var(--mono); background: var(--sunk); padding: 2px 6px; border-radius: 6px; color: var(--ink); word-break: break-all; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--tile), 42vw), 1fr)); gap: 12px; padding-bottom: 140px; }
.tile { position: relative; margin: 0; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: var(--sunk); cursor: pointer; isolation: isolate; transition: transform .3s var(--ease), box-shadow .3s; }
.tile.anim { animation: rise .6s var(--ease) both; animation-delay: calc(min(var(--i), 30) * 22ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-1); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease), opacity .4s; opacity: 0; }
.tile img.ok { opacity: 1; }
.tile:hover img { transform: scale(1.045); }
.tile.alpha { background-color: var(--card); background-image: conic-gradient(var(--sunk) 25%, transparent 0 50%, var(--sunk) 0 75%, transparent 0); background-size: 18px 18px; }
.tile.alpha img { object-fit: contain; padding: 14%; }
.tile.alpha:hover img { transform: scale(1.06); }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 0 var(--sel); transition: box-shadow .18s; z-index: 3; }
.tile.sel::after { box-shadow: inset 0 0 0 3px var(--sel); }
.tile.focus::after { box-shadow: inset 0 0 0 2px var(--ink); }
.tile.sel.focus::after { box-shadow: inset 0 0 0 3px var(--sel), inset 0 0 0 5px var(--card); }
.tile.reject img { filter: grayscale(.85) brightness(.85); opacity: .55; }
.shade { position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(transparent, rgba(0,0,0,.62)); opacity: 0; transition: opacity .3s; pointer-events: none; }
.tile:hover .shade, .tile.focus .shade { opacity: 1; }
.cap { position: absolute; left: 12px; right: 12px; bottom: 34px; color: #fff; font-size: 12px; line-height: 1.35; opacity: 0; transform: translateY(6px); transition: all .3s var(--ease); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none; }
.tile:hover .cap { opacity: 1; transform: none; }
.tag-role { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: #fff; background: rgba(12,12,11,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tag-role .dot { width: 7px; height: 7px; }
.qbar { position: absolute; right: 10px; bottom: 15px; display: flex; gap: 2px; }
.qbar i { width: 9px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); }
.qbar i.on { background: #fff; }
.flag { position: absolute; left: 10px; top: 10px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; background: var(--lime); color: var(--lime-ink); }
.flag.dupe { background: #fff; color: #111; }
.starb { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; opacity: 0; transform: scale(.8); transition: all .25s var(--spring); background: rgba(12,12,11,.35); backdrop-filter: blur(6px); }
.tile:hover .starb { opacity: 1; transform: none; }
.starb.on { opacity: 1; transform: none; color: #FFC531; background: rgba(12,12,11,.5); }
.starb svg { width: 15px; height: 15px; }
.starb.pop { animation: pop .45s var(--spring); }
@keyframes pop { 40% { transform: scale(1.35); } }
.vid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
.vid div { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: var(--shadow-1); }
.vid svg { width: 18px; height: 18px; margin-left: 3px; color: var(--ink); }
.vname { position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nothing { text-align: center; padding: 80px 0 140px; color: var(--ink-3); }
.nothing b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; letter-spacing: -.02em; }
.more { grid-column: 1 / -1; height: 1px; }

/* fly */
.flyer { position: fixed; z-index: 80; border-radius: 12px; object-fit: cover; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

/* dock */
.dock { position: fixed; left: 50%; bottom: 22px; z-index: 40; transform: translate(-50%, 140%); transition: transform .45s var(--spring); background: var(--dock); color: var(--dock-ink); border-radius: 18px; padding: 8px; display: flex; align-items: center; gap: 4px; box-shadow: var(--shadow-2); max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.dock.show { transform: translate(-50%, 0); }
.dock .count { padding: 0 12px 0 10px; font-weight: 600; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dock .sep { width: 1px; height: 22px; background: color-mix(in srgb, var(--dock-ink) 18%, transparent); margin: 0 4px; flex: none; }
.dock button, .dock select, .dock input { height: 36px; border-radius: 11px; padding: 0 11px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--dock-ink); background: transparent; border: 0; transition: background .15s; }
.dock button:hover { background: color-mix(in srgb, var(--dock-ink) 12%, transparent); }
.dock select { appearance: none; background: color-mix(in srgb, var(--dock-ink) 10%, transparent); cursor: pointer; padding-right: 14px; }
.dock select option { color: #111; }
.dock input { width: 90px; background: color-mix(in srgb, var(--dock-ink) 10%, transparent); outline: none; }
.dock input::placeholder { color: color-mix(in srgb, var(--dock-ink) 50%, transparent); }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-columns: 1fr 360px; visibility: hidden; }
.lb.show { visibility: visible; }
.lb .bg { position: absolute; inset: 0; background: rgba(8,8,7,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .35s ease; }
.lb.show .bg { opacity: 1; }
.lb .stage { position: relative; display: grid; place-items: center; padding: 32px; min-height: 0; }
.lb .stage img, .lb .stage video { max-width: 100%; max-height: calc(100vh - 64px); border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.lb .side { position: relative; background: var(--card); padding: 28px 26px; overflow-y: auto; transform: translateX(100%); transition: transform .45s var(--ease); }
.lb.show .side { transform: none; }
.lb .close { position: absolute; top: 18px; left: 18px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; z-index: 2; }
.lb .close:hover { background: rgba(255,255,255,.22); }
.lb .nav { position: absolute; top: 50%; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; z-index: 2; }
.lb .nav:hover { background: rgba(255,255,255,.22); }
.lb .prev { left: 18px; } .lb .next { right: 18px; }
.lb svg { width: 18px; height: 18px; }
.side h3 { margin: 0; font-size: 18px; letter-spacing: -.02em; word-break: break-all; }
.side .path { color: var(--ink-3); font-size: 12px; margin: 4px 0 18px; word-break: break-all; }
.side .caption { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.3; margin: 0 0 18px; letter-spacing: -.01em; }
.side .note { font-size: 13px; color: var(--ink-2); background: var(--sunk); border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; }
.side h5 { margin: 20px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.roles button { height: 36px; border-radius: 10px; border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; transition: all .2s; }
.roles button:hover { border-color: var(--line-2); background: var(--sunk); }
.roles button.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.roles button kbd { margin-left: auto; }
.roles button.on kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--paper) 40%, transparent); }
.fsel { width: 100%; }
.fsel select { width: 100%; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); transition: all .2s; }
.tags button:hover { background: var(--ink); color: var(--paper); }
.qpick { display: flex; gap: 4px; }
.qpick button { flex: 1; height: 8px; border-radius: 4px; background: var(--sunk); transition: background .2s; }
.qpick button.on { background: var(--ink); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 7px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.hint { margin-top: 22px; font-size: 12px; color: var(--ink-3); line-height: 2; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; visibility: hidden; }
.modal.show { visibility: visible; }
.modal .bg { position: absolute; inset: 0; background: rgba(8,8,7,.5); backdrop-filter: blur(6px); opacity: 0; transition: opacity .3s; }
.modal.show .bg { opacity: 1; }
.card { position: relative; width: 480px; max-width: 100%; background: var(--card); border-radius: 22px; padding: 26px; box-shadow: var(--shadow-2); opacity: 0; transform: translateY(16px) scale(.97); transition: all .4s var(--ease); max-height: calc(100vh - 32px); overflow-y: auto; }
.modal.show .card { opacity: 1; transform: none; }
.card h3 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.035em; font-weight: 600; }
.card .lead { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
.card .lead b { color: var(--ink); font-weight: 500; word-break: break-all; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.opt { border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; transition: all .2s; position: relative; }
.opt:hover { border-color: var(--line-2); }
.opt input { position: absolute; opacity: 0; }
.opt b { display: block; font-size: 15px; margin-bottom: 3px; }
.opt small { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; display: block; }
.opt:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.toggle input { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; transition: background .25s; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s var(--spring); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--ink); }
.toggle input:checked::after { transform: translateX(16px); }
.card .row { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
.result { margin-top: 14px; }
.rbar { display: grid; grid-template-columns: 120px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; margin: 7px 0; }
.rbar .track { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.rbar .fill { height: 100%; border-radius: 4px; background: var(--ink); transform-origin: left; animation: grow .8s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.rbar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.done { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 8px; }
.done i { width: 26px; height: 26px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; animation: pop .5s var(--spring); }
.done i svg { width: 14px; height: 14px; }
.help td { padding: 6px 14px 6px 0; font-size: 14px; color: var(--ink-2); }
.help td:first-child { white-space: nowrap; }

/* toast */
.toast { position: fixed; top: 76px; left: 50%; z-index: 90; transform: translate(-50%, -12px); opacity: 0; background: var(--dock); color: var(--dock-ink); padding: 9px 14px 9px 10px; border-radius: 12px; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 9px; transition: all .35s var(--spring); pointer-events: none; box-shadow: var(--shadow-2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast i { width: 20px; height: 20px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; }
.toast i svg { width: 11px; height: 11px; }

.skel { background: linear-gradient(90deg, var(--sunk) 0%, var(--line) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .folders { padding: 20px 16px 16px; margin: 0 -16px; }
  .top .wrap { height: 58px; gap: 8px; }
  .lib, .top .exp span, .btn.go .lbl { display: none; }
  .btn.go .lbl-s { display: inline !important; }
  .search { position: absolute; left: 16px; right: 16px; top: 64px; width: auto; display: none; }
  .search.open { display: block; }
  .searchbtn { display: grid !important; }
  .hero { padding-top: 22px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 12px 14px; }
  .stat .n { font-size: 24px; }
  .folder { width: 140px; }
  .lb { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .lb .side { max-height: 48vh; transform: translateY(100%); padding: 20px 18px; }
  .lb .stage { padding: 60px 12px 12px; }
  .lb .nav { display: none; }
  .opts { grid-template-columns: 1fr; }
  .grid { gap: 8px; }
  :root { --tile: 140px; }
}
.searchbtn { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Cull home"><i><svg viewBox="0 0 16 16"><path d="M3.2 8.4l3 3L12.8 4.8" stroke="#D4FF3F" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>cull</a>
    <span class="lib" id="lib"></span>
    <div class="grow"></div>
    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" placeholder="Search beach, sunset, selfie…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <button class="iconbtn searchbtn" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="iconbtn" id="themeBtn" aria-label="Switch theme"></button>
    <a class="btn exp" href="/api/export.csv" title="Download a CSV shot list"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span>Shot list</span></a>
    <button class="btn go" id="applyBtn"><span class="pip"></span><span class="lbl">Sort into folders</span><span class="lbl-s" hidden>Sort</span></button>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1 id="headline"><span class="skel" style="display:inline-block;width:5ch;height:.8em;border-radius:12px"></span></h1>
    <p class="sub" id="sub">&nbsp;</p>
    <div class="stats" id="stats"></div>
  </section>
  <nav class="folders" id="folders" aria-label="Folders"></nav>
  <div class="bar" id="bar"></div>
  <div id="notice"></div>
  <main class="grid" id="grid"></main>
</div>

<div class="dock" id="dock" role="toolbar" aria-label="Selection">
  <span class="count" id="selCount">0</span>
  <span class="sep"></span>
  <select id="dockFolder" aria-label="Move to folder"></select>
  <span class="sep"></span>
  <span id="dockRoles" style="display:flex;gap:2px"></span>
  <span class="sep"></span>
  <button id="dockStar"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg>Star</button>
  <input id="dockTag" placeholder="+ tag">
  <button id="dockClear" aria-label="Clear selection"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div class="lb" id="lb" aria-hidden="true">
  <div class="bg" data-lbclose></div>
  <div class="stage" id="stage" data-lbclose>
    <button class="close" data-lbclose aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="nav prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div id="media"></div>
  </div>
  <aside class="side" id="side"></aside>
</div>

<div class="modal" id="applyModal">
  <div class="bg" data-close></div>
  <div class="card">
    <h3>Sort into folders</h3>
    <p class="lead">Into <b id="outPath"></b>. Duplicates go to <b>_Duplicates</b>. Nothing is ever deleted.</p>
    <div class="opts">
      <label class="opt"><input type="radio" name="mode" value="copy" checked><b>Copy</b><small>Originals stay put. Safest.</small></label>
      <label class="opt"><input type="radio" name="mode" value="move"><b>Move</b><small>Frees space. One-step undo.</small></label>
    </div>
    <label class="toggle">Leave rejects where they are <input type="checkbox" id="skipRejects" checked></label>
    <label class="toggle">Treat similar shots as duplicates <input type="checkbox" id="nearDupes"></label>
    <div class="result" id="result"></div>
    <div class="row">
      <button class="btn" id="undoBtn" hidden>Undo last move</button>
      <div class="grow"></div>
      <button class="btn" data-close>Close</button>
      <button class="btn go" id="applyGo"><span class="pip"></span>Sort now</button>
    </div>
  </div>
</div>

<div class="modal" id="helpModal">
  <div class="bg" data-close></div>
  <div class="card">
    <h3>Shortcuts</h3>
    <table class="help"><tbody id="helpRows"></tbody></table>
    <div class="row"><div class="grow"></div><button class="btn" data-close>Got it</button></div>
  </div>
</div>

<div class="toast" id="toast"><i><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.2 2.2L9.5 3.7"/></svg></i><span></span></div>

<script>
const ROLES = {
  hero:      { label: "Hero",      key: "h", c: "#F5A524" },
  thumbnail: { label: "Thumbnail", key: "t", c: "#A06BFF" },
  "b-roll":  { label: "B-roll",    key: "b", c: "#3E9BFF" },
  brand:     { label: "Brand",     key: "l", c: "#2BC48A" },
  keep:      { label: "Keep",      key: "k", c: "#9A9A92" },
  reject:    { label: "Reject",    key: "x", c: "#FF5A5F" },
};
const KEY_ROLE = Object.fromEntries(Object.entries(ROLES).map(([r, v]) => [v.key, r]));
const VIEWS = [["starred", "Starred"], ["similar", "Similar"], ["dupes", "Duplicates"], ["unlabelled", "Not labelled"], ["videos", "Videos"]];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const S = {
  data: null, items: [], byId: new Map(),
  folder: null, role: null, view: null, q: "", sort: "best", tile: 180,
  shown: [], selected: new Set(), focus: -1, anchor: -1, limit: 240, lbOpen: false,
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(b >= 1e8 ? 0 : 1) + " MB";
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const ICON = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 012-2h4l2 2.2h7a2 2 0 012 2v7.8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
};

/* ---------- storage (per-viewer conveniences only) ---------- */
function prefs(save) {
  try {
    if (save) localStorage.setItem("cull.prefs", JSON.stringify({ sort: S.sort, tile: S.tile, theme: document.documentElement.dataset.theme || "" }));
    else {
      const p = JSON.parse(localStorage.getItem("cull.prefs") || "{}");
      if (p.sort) S.sort = p.sort;
      if (p.tile) S.tile = p.tile;
      if (p.theme) document.documentElement.dataset.theme = p.theme;
    }
  } catch (e) {}
}

/* ---------- data ---------- */
async function load() {
  const r = await fetch("/api/data");
  if (!r.ok) throw new Error("server said " + r.status);
  S.data = await r.json();
  S.items = S.data.items;
  S.byId = new Map(S.items.map(i => [i.id, i]));
  $("#lib").textContent = S.data.name;
  $("#outPath").textContent = S.data.root + "/Culled";
  document.title = `${S.data.name} · Cull`;
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Cull": "1" }, body: JSON.stringify(body) });
  return r.json();
}

const isDupe = i => !!i.dup_of;
const live = () => S.items.filter(i => !isDupe(i));
function inView(i, ignore = {}) {
  const v = S.view;
  if (v === "dupes") { if (!isDupe(i)) return false; }
  else if (isDupe(i)) return false;
  if (v === "starred" && !i.starred) return false;
  if (v === "similar" && !i.near_of && !i.burst) return false;
  if (v === "unlabelled" && (i.labelled || i.kind !== "image")) return false;
  if (v === "videos" && i.kind !== "video") return false;
  if (!ignore.folder && S.folder !== null && (S.folder === "" ? i.folder : i.folder !== S.folder)) return false;
  if (!ignore.role && S.role && i.role !== S.role) return false;
  if (S.q) {
    const hay = [i.rel, i.caption, i.note, i.folder, i.role, ...(i.tags || [])].join(" ").toLowerCase();
    if (!S.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function sorter(a, b) {
  switch (S.sort) {
    case "date": return b.mtime - a.mtime;
    case "name": return a.rel.localeCompare(b.rel);
    case "size": return b.size - a.size;
    case "folder": {
      const o = S.data.folders, fa = a.folder ? o.indexOf(a.folder) : 99, fb = b.folder ? o.indexOf(b.folder) : 99;
      return fa - fb || (b.quality || 0) - (a.quality || 0);
    }
    default: return (b.starred ? 1 : 0) - (a.starred ? 1 : 0) || (b.quality || 0) - (a.quality || 0) || (b.blur || 0) - (a.blur || 0) || a.rel.localeCompare(b.rel);
  }
}

/* ---------- number animation ---------- */
function countTo(el, to, fmt = n => Math.round(n).toLocaleString()) {
  const from = +(el.dataset.v || 0);
  el.dataset.v = to;
  if (reduce || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- hero ---------- */
function renderHero(first) {
  const L = live(), imgs = L.filter(i => i.kind === "image");
  const labelled = imgs.filter(i => i.labelled).length;
  const dupes = S.items.filter(isDupe);
  const free = dupes.reduce((n, i) => n + i.size, 0);
  if (first) {
    $("#headline").innerHTML = `<span id="hn">0</span> photos,<br><em>culled.</em>`;
  }
  countTo($("#hn"), imgs.length);
  const todo = imgs.length - labelled;
  $("#sub").innerHTML = labelled
    ? `Claude looked at <b>${labelled.toLocaleString()}</b> and filed them into <b>${new Set(L.map(i => i.folder).filter(Boolean)).size} folders</b>.${todo ? ` <b>${todo}</b> still waiting.` : ""}`
    : `Nothing labelled yet. Run <b>/cull</b> in Claude Code to have Claude look at every photo.`;
  const cards = [
    { k: "role:hero", n: L.filter(i => i.role === "hero").length, l: "Hero shots", c: ROLES.hero.c },
    { k: "role:thumbnail", n: L.filter(i => i.role === "thumbnail").length, l: "Thumbnails", c: ROLES.thumbnail.c },
    { k: "role:b-roll", n: L.filter(i => i.role === "b-roll").length, l: "B-roll", c: ROLES["b-roll"].c },
    { k: "role:reject", n: L.filter(i => i.role === "reject").length, l: "Rejects", c: ROLES.reject.c },
    { k: "view:dupes", n: dupes.length, l: "Duplicates", c: "var(--ink)" },
    { k: "view:dupes", n: free, l: "To free up", c: "var(--lime)", fmt: mb },
  ];
  const box = $("#stats");
  if (first) {
    box.innerHTML = cards.map((c, ix) => `<button class="stat" data-k="${c.k}" style="animation: rise .6s ${120 + ix * 50}ms var(--ease) both"><span class="n">0</span><span class="l"><span class="dot" style="--c:${c.c}"></span>${c.l}</span></button>`).join("");
  }
  $$(".stat", box).forEach((el, ix) => {
    const c = cards[ix];
    countTo($(".n", el), c.n, c.fmt);
    const [t, v] = c.k.split(":");
    el.classList.toggle("on", t === "role" ? S.role === v : S.view === v && ix === 4);
  });
}

/* ---------- folders ---------- */
function renderFolders() {
  const L = live().filter(i => inView(i, { folder: true, role: true }));
  const cards = [{ name: null, title: "Everything", items: L }];
  S.data.folders.forEach(f => cards.push({ name: f, title: f, items: L.filter(i => i.folder === f) }));
  const uns = L.filter(i => !i.folder);
  if (uns.length) cards.push({ name: "", title: "Not sorted", items: uns });
  $("#folders").innerHTML = cards.map((c, ix) => {
    const best = [...c.items].filter(i => i.kind === "image").sort((a, b) => (b.quality || 0) - (a.quality || 0) || (b.blur || 0) - (a.blur || 0)).slice(0, 3).reverse();
    const fan = best.length ? best.map(i => `<img src="/thumb/${i.id}" alt="" loading="lazy">`).join("") : `<span class="none">${ICON.folder}</span>`;
    const keyN = c.name ? S.data.folders.indexOf(c.name) : -1;
    const key = keyN >= 0 && keyN < 10 ? `<kbd class="k">${(keyN + 1) % 10}</kbd>` : "";
    const on = S.folder === c.name;
    return `<button class="folder ${on ? "on" : ""} ${c.items.length ? "" : "empty"}" data-folder="${c.name === null ? "*" : esc(c.name)}" style="animation: rise .6s ${200 + ix * 40}ms var(--ease) both"><div class="fan">${fan}</div><div class="t">${esc(c.title)}</div><div class="c">${c.items.length.toLocaleString()}</div>${key}</button>`;
  }).join("");
}
function folderCard(name) {
  return $$(".folder").find(el => el.dataset.folder === name);
}

/* ---------- toolbar ---------- */
function renderBar() {
  const base = S.items.filter(i => inView(i, { role: true }));
  const roleBtns = [[null, "All", base.length]].concat(Object.entries(ROLES).map(([r, v]) => [r, v.label, base.filter(i => i.role === r).length]));
  const vcount = { starred: i => i.starred && !isDupe(i), similar: i => (i.near_of || i.burst) && !isDupe(i), dupes: isDupe, unlabelled: i => !i.labelled && i.kind === "image" && !isDupe(i), videos: i => i.kind === "video" };
  $("#bar").innerHTML = `
    <div class="seg" id="seg"><span class="pill"></span>${roleBtns.map(([r, l, n]) => `<button data-role="${r || ""}" class="${S.role === r ? "on" : ""}">${r ? `<span class="dot" style="--c:${ROLES[r].c}"></span>` : ""}${l}<span class="cnt">${n}</span></button>`).join("")}</div>
    ${VIEWS.map(([v, l]) => { const n = S.items.filter(vcount[v]).length; return n || S.view === v ? `<button class="chip-btn ${S.view === v ? "on" : ""}" data-view="${v}">${v === "starred" ? `<span style="width:13px;height:13px;display:inline-flex;color:#FFC531">${ICON.star}</span>` : ""}${l}<span class="cnt">${n}</span></button>` : ""; }).join("")}
    <div class="grow"></div>
    <div class="sel-wrap"><select id="sortSel" aria-label="Sort">${[["best", "Best first"], ["date", "Newest"], ["folder", "By folder"], ["name", "Name"], ["size", "Largest"]].map(([v, t]) => `<option value="${v}" ${S.sort === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <input type="range" class="size" id="sizeSel" min="120" max="320" value="${S.tile}" aria-label="Photo size">

/* ---------- notice ---------- */

/* ---------- grid ---------- */
function tileHTML(i, idx, anim) {
  const cls = ["tile"];
  if (anim) cls.push("anim");
  if (i.alpha) cls.push("alpha");
  if (i.role === "reject") cls.push("reject");
  if (S.selected.has(i.id)) cls.push("sel");
  if (idx === S.focus) cls.push("focus");
  const media = i.kind === "video"
    ? `<div class="vid"><div>${ICON.play}</div></div><span class="vname">${esc(i.name)}</span>`
    : `<img src="/thumb/${i.id}" alt="${esc(i.caption || i.name)}" loading="lazy" decoding="async" onload="this.classList.add('ok')" onerror="this.classList.add('ok')">`;
  const r = ROLES[i.role];
  const role = r ? `<span class="tag-role"><span class="dot" style="--c:${r.c}"></span>${r.label}</span>` : "";
  const q = i.quality ? `<span class="qbar">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= i.quality ? "on" : ""}"></i>`).join("")}</span>` : "";
  const flag = i.dup_of ? `<span class="flag dupe">Copy</span>` : i.near_of ? `<span class="flag">Similar</span>` : "";
  return `<figure class="${cls.join(" ")}" data-idx="${idx}" data-id="${i.id}" style="--i:${idx}">${media}<div class="shade"></div>${i.caption ? `<figcaption class="cap">${esc(i.caption)}</figcaption>` : ""}${flag}${role}${q}<button class="starb ${i.starred ? "on" : ""}" data-star aria-label="Star">${ICON.star}</button></figure>`;
}
function renderGrid(anim = true) {
  const list = S.items.filter(i => inView(i)).sort(sorter);
  S.shown = list;
  if (S.focus >= list.length) S.focus = list.length - 1;
  renderNotice();
  const grid = $("#grid");
  if (!list.length) {
    grid.innerHTML = `<div class="nothing" style="grid-column:1/-1"><b>Nothing here</b>${S.q ? "Try another word." : "Pick another folder or filter."}</div>`;
    return;
  }
  grid.innerHTML = list.slice(0, S.limit).map((i, ix) => tileHTML(i, ix, anim && !reduce)).join("") + (list.length > S.limit ? `<div class="more" id="more"></div>` : "");
  const more = $("#more");
  if (more) new IntersectionObserver((e, o) => {
    if (!e[0].isIntersecting) return;
    o.disconnect();
    const from = S.limit; S.limit += 240;
    more.insertAdjacentHTML("beforebegin", list.slice(from, S.limit).map((i, k) => tileHTML(i, from + k, false)).join(""));

  }, { rootMargin: "800px" }).observe(more);
}
function marks() {
  $$(".tile").forEach(el => {
    const ix = +el.dataset.idx;
    el.classList.toggle("sel", S.selected.has(el.dataset.id));
    el.classList.toggle("focus", ix === S.focus);
  });

}
function refresh({ anim = false, keepFocus = true } = {}) {
  const fid = keepFocus && S.shown[S.focus] ? S.shown[S.focus].id : null;
  renderHero(); renderFolders(); renderBar(); renderGrid(anim);
  if (fid) { const ix = S.shown.findIndex(i => i.id === fid); S.focus = ix; }
  marks();
}

/* ---------- selection & focus ---------- */
function setFocus(idx, opt = {}) {
  if (!S.shown.length) return;
  idx = Math.max(0, Math.min(S.shown.length - 1, idx));
  if (idx >= S.limit) { S.limit = idx + 120; renderGrid(false); }
  const id = S.shown[idx].id;
  if (opt.range && S.anchor >= 0) {
    const [a, b] = [Math.min(S.anchor, idx), Math.max(S.anchor, idx)];
    for (let k = a; k <= b; k++) S.selected.add(S.shown[k].id);
  } else if (opt.toggle) {
    S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id);
    S.anchor = idx;
  } else if (opt.only) {
    S.selected = new Set([id]); S.anchor = idx;

  }

  const el = $(`.tile[data-idx="${idx}"]`);

}
function targets() {
  if (S.selected.size) return [...S.selected];
  const f = S.shown[S.focus];
  return f ? [f.id] : [];
}

/* ---------- toast ---------- */
function toast(msg) {

  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1700);

/* ---------- flying photos ---------- */
function fly(ids, folderName, max = 14) {
  if (reduce) return Promise.resolve();
  const card = folderCard(folderName);
  if (!card) return Promise.resolve();
  card.scrollIntoView({ inline: "nearest", block: "nearest", behavior: "smooth" });
  const to = card.getBoundingClientRect();
  const runs = ids.slice(0, max).map((id, k) => {
    const tile = $(`.tile[data-id="${id}"]`);
    if (!tile) return null;
    const from = tile.getBoundingClientRect();
    if (from.bottom < 0 || from.top > innerHeight) return null;
    const img = document.createElement("img");
    img.src = `/thumb/${id}`; img.className = "flyer";
    Object.assign(img.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
    document.body.appendChild(img);
    const dx = to.left + to.width / 2 - (from.left + from.width / 2);
    const dy = to.top + 50 - (from.top + from.height / 2);
    const s = 56 / from.width;
    const rot = (Math.random() * 24 - 12).toFixed(1);
    const a = img.animate([
      { transform: "translate(0,0) scale(1) rotate(0)", opacity: 1 },
      { transform: `translate(${dx * .45}px, ${dy * .45 - 70}px) scale(${(1 + s) / 2}) rotate(${rot / 2}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx}px, ${dy}px) scale(${s}) rotate(${rot}deg)`, opacity: .2 },
    ], { duration: 700, delay: k * 45, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
    return a.finished.then(() => img.remove());
  }).filter(Boolean);
  if (!runs.length) { card.classList.remove("bump"); void card.offsetWidth; card.classList.add("bump"); return Promise.resolve(); }
  return Promise.all(runs).then(() => {
    const c = folderCard(folderName);
    if (c) { c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
  });
}

/* ---------- edits ---------- */
async function change(set, label, ids = targets()) {
  if (!ids.length) return;

  const p = fly(ids, f);

  const fid = S.shown[S.focus] && S.shown[S.focus].id;

  let ix = S.shown.findIndex(i => i.id === fid);

}

async function toggleStar(ids = targets()) {

async function addTag(tag) {

/* ---------- lightbox ---------- */
function showLightbox(idx, opening = true) {

  const lb = $("#lb");

    <h5>Quality</h5>

    <h5>Details</h5>

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const star = t.closest("[data-star]");
  if (star) { e.stopPropagation(); return toggleStar([star.closest(".tile").dataset.id]); }
  const tile = t.closest(".tile");
  if (tile) {
    const idx = +tile.dataset.idx;
    if (e.shiftKey) return setFocus(idx, { range: true });
    if (e.metaKey || e.ctrlKey) return setFocus(idx, { toggle: true });
    if (S.selected.size > 1) { S.selected.clear(); }
    S.focus = idx; S.anchor = idx; marks();
    return showLightbox(idx);
  }
  const f = t.closest(".folder");
  if (f) {
    const v = f.dataset.folder === "*" ? null : f.dataset.folder;
    S.folder = S.folder === v ? null : v;
    S.selected.clear(); S.focus = -1; S.limit = 240;
    return refresh({ anim: true, keepFocus: false });
  }
  const seg = t.closest("#seg button");
  if (seg) {
    S.role = seg.dataset.role || null; S.selected.clear(); S.focus = -1; S.limit = 240;
    $$("#seg button").forEach(b => b.classList.toggle("on", b === seg)); movePill();
    renderHero(); renderFolders(); renderGrid(true); marks();
    return;
  }
  const view = t.closest("[data-view]");
  if (view) { S.view = S.view === view.dataset.view ? null : view.dataset.view; S.selected.clear(); S.focus = -1; S.limit = 240; return refresh({ anim: true, keepFocus: false }); }
  const stat = t.closest(".stat");

document.addEventListener("keydown", e => {
  if (!S.data) return;
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tiles = $$(".tile");
  let cols = 1;
  if (tiles.length > 1) { const top0 = tiles[0].offsetTop; cols = tiles.findIndex(el => el.offsetTop !== top0); if (cols < 1) cols = tiles.length; }
  const f = S.focus < 0 ? -1 : S.focus;
  const mode = e.shiftKey ? { range: true } : S.selected.size > 1 ? { keep: true } : { only: true };
  switch (e.key) {
    case "ArrowRight": e.preventDefault(); return setFocus(f + 1, mode);
    case "ArrowLeft": e.preventDefault(); return setFocus(Math.max(0, f - 1), mode);
    case "ArrowDown": if (S.lbOpen) return; e.preventDefault(); return setFocus(f < 0 ? 0 : f + cols, mode);
    case "ArrowUp": if (S.lbOpen) return; e.preventDefault(); return setFocus(Math.max(0, f - cols), mode);
    case " ": case "Enter":
      e.preventDefault();
      if (S.lbOpen) return closeLightbox();
      return S.focus >= 0 && showLightbox(S.focus);
    case "Escape":
      if ($(".modal.show")) return closeModals();
      if (S.lbOpen) return closeLightbox();
      S.selected.clear(); marks(); return;
    case "/": e.preventDefault(); $("#searchBox").classList.add("open"); return $("#search").focus();
    case "?": return showHelp();
    case "a": S.shown.slice(0, S.limit).forEach(i => S.selected.add(i.id)); marks(); return;
    case "s": return toggleStar();

  const max = Math.max(1, ...Object.values(r.folders));
  $("#result").innerHTML = `<div class="done"><i><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.2 2.2L9.5 3.7"/></svg></i>${r.mode === "move" ? "Moved" : "Copied"} ${plural(r.files, "file")}</div>` +
    Object.entries(r.folders).sort((a, b) => b[1] - a[1]).map(([k, v], ix) => `<div class="rbar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${(v / max) * 100}%;animation-delay:${ix * 60}ms"></span></span><span>${v}</span></div>`).join("");
  if (r.mode === "move") { $("#undoBtn").hidden = false; await load(); refresh(); }
};
$("#undoBtn").onclick = async () => {
  const r = await post("/api/undo", {});
  $("#result").innerHTML = `<div class="done">${r.ok ? `Put ${plural(r.restored, "file")} back.` : esc(r.error)}</div>`;
  $("#undoBtn").hidden = true;
  await load(); refresh();
};

function fillDock() {
  $("#dockFolder").innerHTML = `<option value="">Move to…</option>` + S.data.folders.map((f, k) => `<option value="${esc(f)}">${k < 10 ? (k + 1) % 10 + "  " : ""}${esc(f)}</option>`).join("");
  $("#dockRoles").innerHTML = Object.entries(ROLES).map(([r, v]) => `<button data-setrole="${r}"><span class="dot" style="--c:${v.c}"></span>${v.label}</button>`).join("");
}

/* ---------- boot ---------- */
prefs();
themeIcon();
document.documentElement.style.setProperty("--tile", S.tile + "px");
load().then(() => {
  fillDock();
  renderHero(true); renderFolders(); renderBar(); renderGrid(true); marks();
}).catch(err => {
  $("#headline").textContent = "Can’t reach Cull.";
  $("#sub").textContent = "Is the server still running? Start it again from Claude Code. (" + err.message + ")";
});
</script>
</body>
</html>
