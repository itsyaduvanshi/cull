<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cull</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3B2C'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' font-style='italic' text-anchor='middle' fill='%23EEE8DC'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --forest: #1F3B2C; --forest-dark: #132519; --forest-2: #284A38;
  --oxblood: #5E1B1B; --ox-2: #7A2525; --ox-bright: #A8382F;
  --paper: #EEE8DC; --paper-2: #E4DCCB; --sage: #8FA593; --charcoal: #1B1E1B;
  /* roles of the surface */
  --bg: var(--forest); --bg-dark: var(--forest-dark); --text: var(--paper); --text-2: rgba(238,232,220,.66); --text-3: rgba(238,232,220,.4);
  --node: #182A1F; --node-line: rgba(143,165,147,.28); --wire: rgba(143,165,147,.38); --dot: rgba(238,232,220,.07);
  --win: var(--paper); --win-ink: var(--charcoal); --win-ink-2: #5E615B; --win-line: #CFC6B2;
  --shadow: 5px 5px 0 rgba(8,18,12,.55);
  --shadow-sm: 3px 3px 0 rgba(8,18,12,.5);
  --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Montserrat", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  --tile: 200px;
  color-scheme: dark;
}
:root[data-theme="paper"] {
  --bg: var(--paper); --bg-dark: var(--paper-2); --text: var(--charcoal); --text-2: rgba(27,30,27,.66); --text-3: rgba(27,30,27,.42);
  --node: var(--forest); --node-line: rgba(31,59,44,.25); --wire: rgba(31,59,44,.35); --dot: rgba(27,30,27,.07);
  --win: #F8F4EC; --win-line: #D8CFBD;
  --shadow: 5px 5px 0 rgba(31,59,44,.9); --shadow-sm: 3px 3px 0 rgba(31,59,44,.85);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px), radial-gradient(1200px 700px at 50% 0%, rgba(255,255,255,.04), transparent 70%), radial-gradient(900px 600px at 50% 120%, rgba(0,0,0,.25), transparent 70%);
  background-size: 22px 22px, auto, auto; background-attachment: fixed;
  color: var(--text); font: 500 14.5px/1.45 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh;
  transition: background-color .4s, color .4s;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; position: relative; }
.mono { font-family: var(--mono); font-weight: 500; letter-spacing: .02em; }
.caps { text-transform: uppercase; }
kbd { font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .55; }

/* corner brackets */
.corner { position: fixed; width: 18px; height: 18px; border: 0 solid var(--text-3); z-index: 5; pointer-events: none; }
.corner.tl { top: 14px; left: 14px; border-top-width: 1.5px; border-left-width: 1.5px; }
.corner.tr { top: 14px; right: 14px; border-top-width: 1.5px; border-right-width: 1.5px; }
.corner.bl { bottom: 14px; left: 14px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
.corner.br { bottom: 14px; right: 14px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding: 26px 0 0; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
.brand b { font: 400 26px/1 var(--serif); font-style: italic; letter-spacing: 0; text-transform: none; color: var(--text); }
.brand .sep { width: 4px; height: 4px; background: var(--text-3); border-radius: 50%; }
.grow { flex: 1; }
.chip-status { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1.5px solid var(--node-line); font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.chip-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.chip-status[data-s="busy"] i { background: var(--ox-bright); animation: pulse 1s infinite; }
.chip-status[data-s="done"] i { background: var(--sage); box-shadow: 0 0 0 3px rgba(143,165,147,.25); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(168,56,47,0); } 0% { box-shadow: 0 0 0 0 rgba(168,56,47,.6); } }
.ibtn { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--node-line); display: grid; place-items: center; color: var(--text-2); transition: all .2s; }
.ibtn:hover { color: var(--text); border-color: var(--text-3); }
.ibtn svg { width: 16px; height: 16px; }
.ibtn.on { color: var(--text); }

/* mode tabs */
.modes { display: flex; gap: 28px; margin: 34px 0 0; position: relative; width: max-content; max-width: 100%; }
.mode { font: 400 30px/1 var(--serif); text-transform: uppercase; letter-spacing: .01em; color: var(--text-3); padding-bottom: 10px; display: flex; align-items: baseline; gap: 8px; transition: color .3s; }
.mode:hover { color: var(--text-2); }
.mode.on { color: var(--text); }
.mode sup { font: 600 11px var(--mono); letter-spacing: .04em; }
.modes .bar { position: absolute; bottom: 0; height: 3px; background: var(--ox-bright); border-radius: 2px; transition: left .45s var(--ease), width .45s var(--ease); }

/* headline lockup */
.lockup { margin: 22px 0 28px; font-size: clamp(40px, 6.4vw, 84px); line-height: .92; position: relative; }
.lockup .l1 { display: block; font: 800 .36em/1.1 var(--sans); letter-spacing: -.02em; margin-bottom: .08em; }
.lockup .l2 { display: block; font-family: var(--serif); font-style: italic; text-transform: uppercase; letter-spacing: -.01em; }
.lockup .l2 .ox { color: var(--ox-bright); font-style: normal; }
:root[data-theme="paper"] .lockup .l2 { color: var(--oxblood); }
.lockup .line { display: block; width: max-content; max-width: 100%; }
.lockup .in { animation: wipeIn .9s var(--ease) both; }
@keyframes wipeIn { from { clip-path: inset(0 100% 0 0); transform: translateY(8px); } to { clip-path: inset(0 0 0 0); } }
.lockup .l1.in { animation-delay: .05s; }
.lockup .l2.in { animation-delay: .18s; }

/* retro window */
.win { background: var(--win); color: var(--win-ink); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid rgba(0,0,0,.18); }
.win .tb { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: var(--paper-2); border-bottom: 1.5px solid var(--win-line); font: 600 11px var(--mono); color: var(--win-ink-2); letter-spacing: .04em; }
:root[data-theme="paper"] .win .tb { background: #EFE8DA; }
.win .tb svg { width: 12px; height: 12px; }
.win .tb .sq { width: 13px; height: 13px; border: 1.5px solid var(--win-ink-2); border-radius: 2px; opacity: .55; }
.strip { display: flex; align-items: stretch; }
.cell { flex: 1; padding: 12px 18px 14px; border-right: 1.5px dashed var(--win-line); min-width: 0; }
.cell .l { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--win-ink-2); white-space: nowrap; }
.cell .n { font: 400 40px/1 var(--serif); margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell .n small { font: 600 11px var(--mono); color: var(--win-ink-2); margin-left: 4px; }
.cell .n.roll { animation: roll .25s var(--ease); }
@keyframes roll { from { transform: translateY(-30%); opacity: .3; } }
.run { flex: none; align-self: center; margin: 0 16px; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 8px; background: var(--oxblood); color: var(--paper); font: 800 15px var(--sans); letter-spacing: .02em; border: 1.5px solid #2A0B0B; box-shadow: 4px 4px 0 #2A0B0B; transition: transform .12s, box-shadow .12s, background .2s; white-space: nowrap; }
.run:hover { background: var(--ox-2); }
.run:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #2A0B0B; }
.run:disabled { cursor: default; }
.run svg { width: 16px; height: 16px; }
.run.save { background: var(--forest); border-color: #0B1A11; box-shadow: 4px 4px 0 #0B1A11; }
.run.save:hover { background: var(--forest-2); }
.run.save:active { box-shadow: 1px 1px 0 #0B1A11; }
.run .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(238,232,220,.3); border-top-color: var(--paper); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.replay { flex: none; align-self: center; margin-right: 14px; width: 38px; height: 38px; border-radius: 8px; border: 1.5px solid var(--win-line); display: grid; place-items: center; color: var(--win-ink-2); transition: all .2s; }
.replay:hover { color: var(--win-ink); border-color: var(--win-ink-2); }
.replay svg { width: 16px; height: 16px; }

/* stage */
.stage { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 1.2fr) minmax(0, 1fr); gap: 0 34px; margin: 38px 0 0; align-items: center; }
.stage.swap { animation: swap .6s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translateY(14px); } }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.wires path { fill: none; stroke: var(--wire); stroke-width: 1.5; stroke-dasharray: 3 5; transition: stroke .3s; }
.wires path.live { stroke: var(--ox-bright); stroke-dasharray: 8 6; stroke-width: 2; animation: flow .5s linear infinite; }
.wires path.done { stroke: var(--sage); stroke-dasharray: none; opacity: .55; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.wires circle { fill: var(--sage); }
.col { display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1; }
.node { position: relative; display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 12px 11px 14px; border-radius: 10px; background: var(--node); color: var(--paper); border: 1.5px solid var(--node-line); box-shadow: var(--shadow-sm); transition: transform .25s var(--ease), border-color .2s, opacity .3s; min-width: 0; }
.node:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 rgba(8,18,12,.55); }
.node.on { border-color: var(--paper); }
.node.zero { opacity: .55; }
.node .led { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: rgba(238,232,220,.18); transition: background .3s; }
.node:not(.zero) .led { background: var(--sage); box-shadow: 0 0 0 3px rgba(143,165,147,.2); }
.node.hit { animation: hit .5s var(--spring); }
.node.hit .led { background: var(--ox-bright); box-shadow: 0 0 0 4px rgba(168,56,47,.3); }
@keyframes hit { 30% { transform: scale(1.04); border-color: var(--ox-bright); } }
.node .ic { width: 34px; height: 34px; flex: none; border-radius: 8px; display: grid; place-items: center; background: rgba(238,232,220,.08); color: var(--sage); }
.node .ic svg { width: 17px; height: 17px; }
.node .meta { min-width: 0; flex: 1; }
.node .t { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: rgba(238,232,220,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .c { display: flex; align-items: baseline; gap: 6px; }
.node .c b { font: 400 30px/1.05 var(--serif); font-weight: 400; font-variant-numeric: tabular-nums; display: inline-block; }
.node .c b.roll { animation: roll .25s var(--ease); }
.node .c span { font: 500 11px var(--mono); color: rgba(238,232,220,.5); }
.node .thumbs { display: flex; flex: none; }
.node .thumbs img { width: 26px; height: 34px; object-fit: cover; border-radius: 4px; border: 1.5px solid var(--paper); margin-left: -10px; box-shadow: 2px 2px 0 rgba(0,0,0,.35); transition: transform .3s var(--spring); }
.node .thumbs img:first-child { margin-left: 0; }
.node:hover .thumbs img:nth-child(1) { transform: rotate(-8deg) translateX(-3px); }
.node:hover .thumbs img:nth-child(3) { transform: rotate(8deg) translateX(3px); }
.node .k { position: absolute; bottom: 7px; right: 8px; font: 600 9.5px var(--mono); color: rgba(238,232,220,.35); }
.plus { position: absolute; right: 18px; top: -4px; font: 600 12px var(--mono); color: var(--ox-bright); background: var(--paper); padding: 1px 5px; border-radius: 4px; pointer-events: none; animation: plus .8s var(--ease) forwards; z-index: 3; }
@keyframes plus { from { transform: translateY(6px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(-18px); opacity: 0; } }

.heapbox { position: relative; height: 470px; display: grid; place-items: center; z-index: 1; }
.heapbox.shake { animation: shake .45s; }
@keyframes shake { 20% { transform: translate(-3px, 2px); } 40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(1px, 0); } }
.heap { position: relative; width: 320px; height: 320px; animation: drift 10s ease-in-out infinite; }
@keyframes drift { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-6px); } }
.pol { position: absolute; left: 50%; top: 50%; width: 104px; margin: -68px 0 0 -52px; padding: 5px 5px 0; background: var(--paper); border-radius: 3px; box-shadow: 3px 4px 0 rgba(8,18,12,.45), 0 10px 24px rgba(0,0,0,.25); transform: translate(var(--x), var(--y)) rotate(var(--r)); animation: drop .8s var(--spring) both; animation-delay: var(--d); }
@keyframes drop { from { opacity: 0; transform: translate(calc(var(--x) * .3), -260px) rotate(calc(var(--r) * -2)); } }
.pol .im { height: 108px; background: #CFC6B2; overflow: hidden; border-radius: 1px; position: relative; }
.pol .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pol .cap2 { font: 600 8.5px/22px var(--mono); color: #4A4D47; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; padding: 0 2px; display: flex; gap: 4px; align-items: center; }
.pol .cap2 svg { width: 7px; height: 7px; flex: none; color: var(--oxblood); }
.heapnote { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.heapnote b { color: var(--text); }
.stamp { position: absolute; z-index: 4; text-align: center; color: var(--ox-bright); border: 3px solid currentColor; border-radius: 10px; padding: 10px 22px 12px; transform: rotate(-8deg); background: var(--bg); box-shadow: 0 0 0 10px var(--bg); }
:root[data-theme="paper"] .stamp { color: var(--oxblood); }
.stamp.thump { animation: thump .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes thump { from { transform: rotate(-16deg) scale(2.6); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-8deg) scale(1); } }
.stamp .big { font: 400 64px/1 var(--serif); text-transform: uppercase; letter-spacing: .02em; }
.stamp .sm { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.stamp::after { content: ""; position: absolute; inset: 4px; border: 1px solid currentColor; border-radius: 6px; opacity: .5; }
.after { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); animation: rise .6s .4s var(--ease) both; }
.flyer { position: fixed; z-index: 90; pointer-events: none; padding: 4px 4px 0; background: var(--paper); border-radius: 3px; box-shadow: 3px 4px 0 rgba(8,18,12,.45), 0 10px 24px rgba(0,0,0,.3); will-change: transform; }
.flyer .im { background: #CFC6B2; overflow: hidden; }
.flyer img { width: 100%; height: 100%; object-fit: cover; display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* library */
.lib { margin-top: 60px; padding-bottom: 150px; }
.lhead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; border-top: 1.5px solid var(--node-line); padding-top: 26px; }
.lhead h2 { margin: 0; font: 400 46px/.9 var(--serif); text-transform: uppercase; }
.lhead h2 i { color: var(--sage); }
.lhead .cnt { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); padding-bottom: 4px; }
.crumb { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 12px; border-radius: 7px; background: var(--paper); color: var(--charcoal); font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; box-shadow: var(--shadow-sm); margin-bottom: 2px; }
.crumb button { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; background: rgba(0,0,0,.08); }
.crumb svg { width: 9px; height: 9px; }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.seg { display: inline-flex; position: relative; border: 1.5px solid var(--node-line); border-radius: 9px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; z-index: 1; height: 28px; padding: 0 10px; border-radius: 6px; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: color .2s; }
.seg button.on { color: var(--charcoal); }
.seg button .k { opacity: .55; }
.seg .slider { position: absolute; z-index: 0; top: 3px; height: 28px; border-radius: 6px; background: var(--paper); transition: left .35s var(--ease), width .35s var(--ease); }
.dotc { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.fchip { height: 34px; padding: 0 11px; border-radius: 8px; border: 1.5px solid var(--node-line); font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; transition: all .2s; white-space: nowrap; }
.fchip:hover { color: var(--text); border-color: var(--text-3); }
.fchip.on { background: var(--paper); color: var(--charcoal); border-color: var(--paper); }
.fchip .k { opacity: .55; }
.fchip svg { width: 12px; height: 12px; }
.selw { position: relative; }
.selw select { appearance: none; height: 34px; border-radius: 8px; border: 1.5px solid var(--node-line); background: transparent; padding: 0 30px 0 11px; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); cursor: pointer; }
.selw select option { color: #1B1E1B; }
.selw::after { content: ""; position: absolute; right: 12px; top: 13px; width: 5px; height: 5px; border-right: 1.5px solid var(--text-2); border-bottom: 1.5px solid var(--text-2); transform: rotate(45deg); pointer-events: none; }
.range { width: 84px; accent-color: var(--ox-bright); }
.notice { display: flex; gap: 12px; align-items: center; background: var(--oxblood); color: var(--paper); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; font-size: 13.5px; box-shadow: var(--shadow-sm); }
.notice svg { width: 18px; height: 18px; flex: none; }
.notice code { font: 500 12px var(--mono); background: rgba(0,0,0,.25); padding: 2px 6px; border-radius: 4px; word-break: break-all; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--tile), 42vw), 1fr)); gap: 18px 16px; }
.tile { position: relative; margin: 0; padding: 6px 6px 0; background: var(--paper); border-radius: 5px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .25s var(--ease), box-shadow .25s; }
.tile.anim { animation: rise .5s var(--ease) both; animation-delay: calc(min(var(--i), 28) * 18ms); }
.tile:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 rgba(8,18,12,.5); }
.tile .im { position: relative; aspect-ratio: 4 / 5; background: #CFC6B2; overflow: hidden; border-radius: 2px; }
.tile.vid .im { aspect-ratio: 9 / 14; }
.tile .im > img, .tile .im > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease), opacity .35s; }
.tile .im > img { opacity: 0; }
.tile .im > img.ok { opacity: 1; }
.tile .im > video { opacity: 0; }
.tile .im > video.ok { opacity: 1; }
.tile:hover .im > img { transform: scale(1.04); }
.tile.alpha .im { background-color: #F7F3EA; background-image: conic-gradient(#E4DCCB 25%, transparent 0 50%, #E4DCCB 0 75%, transparent 0); background-size: 16px 16px; }
.tile.alpha .im > img { object-fit: contain; padding: 14%; }
.tile.reject .im > img { filter: grayscale(.9) contrast(.9); opacity: .55; }
.tile .foot { display: flex; align-items: center; gap: 6px; height: 30px; font: 600 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: #4A4D47; padding: 0 2px; }
.tile .foot .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .foot .q { color: var(--oxblood); flex: none; }
.tile .cap { position: absolute; left: 10px; right: 10px; bottom: 34px; color: #fff; font-size: 12px; line-height: 1.35; opacity: 0; transform: translateY(6px); transition: all .3s var(--ease); pointer-events: none; z-index: 2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.tile .im::after { content: ""; position: absolute; inset: 40% 0 0 0; background: linear-gradient(transparent, rgba(10,14,10,.7)); opacity: 0; transition: opacity .3s; }
.tile:hover .im::after, .tile:hover .cap { opacity: 1; transform: none; }
.lchip { position: absolute; left: 12px; top: 12px; z-index: 3; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--paper); color: var(--charcoal); font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; box-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.vchip { position: absolute; right: 12px; top: 12px; z-index: 3; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--charcoal); color: var(--paper); font: 600 10px var(--mono); letter-spacing: .04em; }
.vchip svg { width: 7px; height: 7px; }
.sim { position: absolute; left: 12px; bottom: 42px; z-index: 3; height: 20px; padding: 0 7px; border-radius: 5px; background: var(--sage); color: var(--charcoal); font: 600 9.5px/20px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.sim.dupe { background: var(--ox-bright); color: var(--paper); }
.starb { position: absolute; right: 10px; bottom: 40px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--paper); opacity: 0; transform: scale(.8); transition: all .25s var(--spring); background: rgba(20,20,18,.45); }
.tile:hover .starb { opacity: 1; transform: none; }
.starb.on { opacity: 1; transform: none; color: #E8B04A; }
.starb svg { width: 14px; height: 14px; }
.starb.pop { animation: pop .45s var(--spring); }
@keyframes pop { 50% { transform: scale(1.35); } }
/* selection box: dashed frame with corner squares */
.tile .selbox { position: absolute; inset: -7px; border: 1.5px dashed var(--sage); border-radius: 7px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 4; }
.tile .selbox i { position: absolute; width: 7px; height: 7px; background: var(--paper); border: 1.5px solid var(--sage); }
.tile .selbox i:nth-child(1) { left: -4px; top: -4px; } .tile .selbox i:nth-child(2) { right: -4px; top: -4px; } .tile .selbox i:nth-child(3) { left: -4px; bottom: -4px; } .tile .selbox i:nth-child(4) { right: -4px; bottom: -4px; }
.tile.focus .selbox { opacity: 1; }
.tile.sel { box-shadow: 0 0 0 3px var(--ox-bright), var(--shadow-sm); }
.tile.sel .selbox { opacity: 1; border-color: var(--ox-bright); border-style: solid; }
.tile.sel .selbox i { border-color: var(--ox-bright); }
.novid { position: absolute; inset: 0; display: grid; place-items: center; font: 600 10px var(--mono); color: #4A4D47; text-align: center; padding: 10px; }
.nothing { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-2); font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.nothing b { display: block; font: 400 34px var(--serif); color: var(--text); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0; }
.more { grid-column: 1 / -1; height: 1px; }

/* dock */
.dock { position: fixed; left: 50%; bottom: 22px; z-index: 40; transform: translateX(-50%); background: var(--charcoal); color: var(--paper); border-radius: 12px; padding: 6px; display: flex; align-items: center; gap: 4px; box-shadow: 5px 5px 0 rgba(0,0,0,.35); border: 1.5px solid rgba(238,232,220,.12); max-width: calc(100vw - 24px); }
.dock .search { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; height: 40px; width: 430px; max-width: calc(100vw - 40px); transition: width .4s var(--ease); cursor: text; }
.dock .search svg { width: 15px; height: 15px; opacity: .6; flex: none; }
.dock .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--paper); font: 500 12.5px var(--mono); letter-spacing: .02em; }
.dock .search input::placeholder { color: rgba(238,232,220,.45); }
.dock .acts { display: none; align-items: center; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.dock .acts::-webkit-scrollbar { display: none; }
.dock.sel .acts { display: flex; animation: rise .3s var(--ease); }
.dock.sel .search { width: 44px; padding: 0 14px; }
.dock.sel .search input, .dock.sel .search kbd { display: none; }
.dock .count { padding: 0 10px 0 4px; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.dock .sep { width: 1px; height: 22px; background: rgba(238,232,220,.15); margin: 0 3px; flex: none; }
.dock .acts button, .dock .acts select, .dock .acts input { height: 34px; border-radius: 7px; padding: 0 9px; font: 600 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--paper); background: transparent; border: 0; transition: background .15s; flex: none; }
.dock .acts button:hover { background: rgba(238,232,220,.1); }
.dock .acts select { appearance: none; background: rgba(238,232,220,.08); cursor: pointer; }
.dock .acts select option { color: #1B1E1B; text-transform: none; }
.dock .acts input { width: 80px; background: rgba(238,232,220,.08); outline: none; text-transform: none; }
.dock .acts svg { width: 13px; height: 13px; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 28px; visibility: hidden; }
.lb.show { visibility: visible; }
.lb .bg { position: absolute; inset: 0; background: rgba(10,18,13,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .3s; }
.lb.show .bg { opacity: 1; }
.lb .win { position: relative; width: min(1180px, 100%); height: min(780px, calc(100vh - 56px)); display: flex; flex-direction: column; opacity: 0; transform: translateY(18px) scale(.97); transition: all .4s var(--ease); }
.lb.show .win { opacity: 1; transform: none; }
.lb .tb .x { margin-left: auto; display: flex; gap: 6px; }
.lb .tb button { width: 18px; height: 18px; border: 1.5px solid var(--win-ink-2); border-radius: 3px; display: grid; place-items: center; color: var(--win-ink-2); }
.lb .tb button:hover { color: var(--win-ink); border-color: var(--win-ink); }
.lb .tb button svg { width: 9px; height: 9px; }
.lb .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 350px; }
.lb .view { position: relative; background: #12140F; display: grid; place-items: center; min-height: 0; padding: 16px 60px; }
.lb .view img, .lb .view video { max-width: 100%; max-height: 100%; border-radius: 3px; display: block; }
.lb .nav { position: absolute; top: 50%; width: 38px; height: 38px; margin-top: -19px; border-radius: 8px; background: rgba(238,232,220,.1); color: var(--paper); display: grid; place-items: center; }
.lb .nav:hover { background: rgba(238,232,220,.2); }
.lb .nav svg { width: 16px; height: 16px; }
.lb .prev { left: 12px; } .lb .next { right: 12px; }
.lb .side { padding: 20px 20px 24px; overflow-y: auto; border-left: 1.5px solid var(--win-line); }
.side .path { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--win-ink-2); word-break: break-all; }
.side h3 { margin: 4px 0 12px; font: 400 30px/1 var(--serif); text-transform: uppercase; word-break: break-word; }
.side .caption { font: 500 14px/1.5 var(--sans); margin: 0 0 14px; }
.side .note { font-size: 12.5px; background: var(--oxblood); color: var(--paper); border-radius: 7px; padding: 8px 11px; margin-bottom: 12px; }
.side h5 { margin: 18px 0 8px; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--win-ink-2); }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.roles button { height: 32px; border-radius: 7px; border: 1.5px solid var(--win-line); display: flex; align-items: center; gap: 7px; padding: 0 9px; font: 600 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; transition: all .15s; }
.roles button:hover { border-color: var(--win-ink-2); }
.roles button.on { background: var(--forest); color: var(--paper); border-color: var(--forest); box-shadow: 2px 2px 0 #0B1A11; }
.roles button kbd { margin-left: auto; }
.side .selw select { width: 100%; color: var(--win-ink); border-color: var(--win-line); text-transform: none; font: 500 13px var(--sans); letter-spacing: 0; }
.side .selw::after { border-color: var(--win-ink-2); }
.qpick { display: flex; gap: 4px; }
.qpick button { flex: 1; height: 9px; border-radius: 2px; background: var(--win-line); transition: background .15s; }
.qpick button.on { background: var(--oxblood); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags button { font: 600 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; border: 1.5px solid var(--win-line); color: var(--win-ink-2); transition: all .15s; }
.tags button:hover { background: var(--forest); color: var(--paper); border-color: var(--forest); }
.sheet { position: relative; border-radius: 4px; overflow: hidden; cursor: pointer; border: 1.5px solid var(--win-line); }
.sheet img { width: 100%; display: block; }
.sheet .h { position: absolute; right: 6px; bottom: 6px; font: 600 9.5px var(--mono); color: var(--paper); background: rgba(20,20,18,.7); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
.hookbtn { margin-top: 8px; width: 100%; height: 36px; border-radius: 7px; background: var(--oxblood); color: var(--paper); font: 700 12px var(--sans); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 3px 3px 0 #2A0B0B; transition: transform .1s, box-shadow .1s; }
.hookbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2A0B0B; }
.hookbtn svg { width: 11px; height: 11px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 5px 10px; font: 500 12px var(--mono); margin: 0; }
.kv dt { color: var(--win-ink-2); text-transform: uppercase; font-size: 10.5px; letter-spacing: .06em; padding-top: 1px; }
.kv dd { margin: 0; }
.hint { margin-top: 18px; font: 600 10px/2.1 var(--mono); color: var(--win-ink-2); text-transform: uppercase; letter-spacing: .05em; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; visibility: hidden; }
.modal.show { visibility: visible; }
.modal .bg { position: absolute; inset: 0; background: rgba(10,18,13,.6); backdrop-filter: blur(5px); opacity: 0; transition: opacity .3s; }
.modal.show .bg { opacity: 1; }
.modal .win { position: relative; width: 500px; max-width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; opacity: 0; transform: translateY(16px) scale(.97); transition: all .4s var(--ease); }
.modal.show .win { opacity: 1; transform: none; }
.modal .in2 { padding: 22px 22px 20px; }
.modal h3 { margin: 0 0 6px; font: 400 40px/1 var(--serif); text-transform: uppercase; }
.modal h3 i { color: var(--oxblood); }
.modal .lead { margin: 0 0 16px; color: var(--win-ink-2); font-size: 13.5px; }
.modal .lead b { color: var(--win-ink); font-weight: 600; word-break: break-all; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.opt { border: 1.5px solid var(--win-line); border-radius: 8px; padding: 13px; cursor: pointer; transition: all .15s; position: relative; }
.opt input { position: absolute; opacity: 0; }
.opt b { display: block; font: 800 14px var(--sans); }
.opt small { color: var(--win-ink-2); font-size: 12px; display: block; margin-top: 2px; }
.opt:has(input:checked) { border-color: var(--forest); box-shadow: 3px 3px 0 var(--forest); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1.5px dashed var(--win-line); font-size: 13.5px; cursor: pointer; }
.toggle input { appearance: none; width: 38px; height: 22px; border-radius: 5px; background: var(--win-line); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 3px; background: #fff; transition: transform .3s var(--spring); box-shadow: 1px 1px 0 rgba(0,0,0,.2); }
.toggle input:checked { background: var(--forest); }
.toggle input:checked::after { transform: translateX(16px); }
.row { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.btn { height: 38px; padding: 0 14px; border-radius: 7px; border: 1.5px solid var(--win-line); font: 700 12.5px var(--sans); display: inline-flex; align-items: center; gap: 7px; transition: all .12s; white-space: nowrap; color: var(--win-ink); }
.btn:hover { border-color: var(--win-ink-2); }
.btn.go { background: var(--forest); border-color: #0B1A11; color: var(--paper); box-shadow: 3px 3px 0 #0B1A11; }
.btn.go:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0B1A11; }
.btn svg { width: 14px; height: 14px; }
.rbar { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; font: 500 11.5px var(--mono); margin: 6px 0; }
.rbar .track { height: 8px; border-radius: 2px; background: var(--win-line); overflow: hidden; }
.rbar .fill { display: block; height: 100%; background: var(--forest); transform-origin: left; animation: grow .8s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.rbar span:last-child { text-align: right; }
.done { display: flex; align-items: center; gap: 10px; font: 800 14px var(--sans); margin: 14px 0 8px; }
.done i { width: 24px; height: 24px; border-radius: 5px; background: var(--forest); color: var(--paper); display: grid; place-items: center; }
.done i svg { width: 12px; height: 12px; }
.help td { padding: 5px 14px 5px 0; font-size: 13px; color: var(--win-ink-2); }
.help td:first-child { white-space: nowrap; }
.help kbd { opacity: .8; }

.toast { position: fixed; top: 22px; left: 50%; z-index: 95; transform: translate(-50%, -14px); opacity: 0; background: var(--paper); color: var(--charcoal); padding: 8px 14px 8px 9px; border-radius: 8px; font: 600 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; display: flex; align-items: center; gap: 9px; transition: all .35s var(--spring); pointer-events: none; box-shadow: var(--shadow-sm); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast i { width: 18px; height: 18px; border-radius: 4px; background: var(--forest); color: var(--paper); display: grid; place-items: center; }
.toast i svg { width: 10px; height: 10px; }

@media (max-width: 1000px) {
  .stage { grid-template-columns: 1fr; gap: 14px; }
  .wires { display: none; }
  .col { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding: 4px 32px 8px; margin: 0 -32px; }
  .col::-webkit-scrollbar { display: none; }
  .node { flex: none; width: 220px; }
  .heapbox { height: 380px; }
  .strip { flex-wrap: wrap; }
  .cell { flex: 1 1 30%; border-right: 0; border-bottom: 1.5px dashed var(--win-line); }
  .run { flex: 1 1 auto; justify-content: center; margin: 12px; }
  .lb .body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .lb .side { max-height: 45%; border-left: 0; border-top: 1.5px solid var(--win-line); }
}
@media (max-width: 640px) {
  .wrap { padding: 0 18px; }
  .col { padding: 4px 18px 8px; margin: 0 -18px; }
  .node { width: 190px; }
  .corner { display: none; }
  .mode { font-size: 24px; }
  .cell .n { font-size: 32px; }
  .heap { transform: scale(.82); }
  .lb { padding: 8px; }
  .lb .win { height: calc(100vh - 16px); }
  .lb .view { padding: 10px; }
  .lb .nav { display: none; }
  .opts { grid-template-columns: 1fr; }
  .dock .search { width: calc(100vw - 40px); }
  :root { --tile: 150px; }
  .grid { gap: 12px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Cull</b><span class="sep"></span><span>Reel sorter</span><span class="sep"></span><span id="libName"></span></div>
    <div class="grow"></div>
    <span class="chip-status" id="status" data-s="idle"><i></i><span class="txt">Loading</span></span>

    <button class="ibtn" id="themeBtn" aria-label="Switch theme"></button>
  </header>

  <nav class="modes" id="modes">

  <h1 class="lockup" id="lockup"></h1>

  <div class="win">
    <div class="tb"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 2h3v3H2zM7 2h3v3H7zM2 7h3v3H2zM7 7h3v3H7z"/></svg><span id="winTitle">sort.exe</span><span class="grow"></span><span class="sq"></span><span class="sq"></span><span class="sq"></span></div>
    <div class="strip" id="strip"></div>
  </div>

  <section class="stage" id="stage">
    <svg class="wires" id="wires"></svg>
    <div class="col" id="colL"></div>
    <div class="heapbox" id="heapbox"><div class="heap" id="heap"></div><div class="heapnote" id="heapnote"></div></div>
    <div class="col" id="colR"></div>
  </section>

  <section class="lib" id="lib">
    <div class="lhead"><h2 id="libTitle">The <i>library.</i></h2><span id="crumb"></span><span class="cnt" id="bcount"></span></div>
    <div class="filters" id="filters"></div>
    <div id="notice"></div>
    <main class="grid" id="grid"></main>
  </section>
</div>

<div class="dock" id="dock">
  <label class="search" id="searchWrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" placeholder="Search by tag, like drone or sunset" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
  <div class="acts">
    <span class="count" id="selCount"></span><span class="sep"></span>
    <select id="dockFolder" aria-label="Move to folder"></select><span class="sep"></span>
    <span id="dockRoles" style="display:flex;gap:2px"></span><span class="sep"></span>
    <button id="dockStar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg>Star</button>
    <input id="dockTag" placeholder="+ tag">
    <button id="dockClear" aria-label="Clear selection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<div class="lb" id="lb" aria-hidden="true">
  <div class="bg" data-lbclose></div>
  <div class="win">
    <div class="tb"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M1.5 2.5h9v7h-9z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 4.5l2.5 1.5L5 7.5z"/></svg><span id="lbTitle">preview.exe</span><span class="x"><button id="prevT" aria-label="Previous"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 2L3.5 5l3 3"/></svg></button><button id="nextT" aria-label="Next"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 2l3 3-3 3"/></svg></button><button data-lbx aria-label="Close"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 2l6 6M8 2L2 8"/></svg></button></span></div>
    <div class="body">
      <div class="view" id="view"><button class="nav prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div id="media" style="display:contents"></div><button class="nav next" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
      <aside class="side" id="side"></aside>
    </div>
  </div>
</div>

<div class="modal" id="saveModal">
  <div class="bg" data-close></div>
  <div class="win">
    <div class="tb"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 3.5h3l1 1h4v5H2z"/></svg>save.exe<span class="grow"></span><span class="sq"></span><span class="sq"></span><span class="sq"></span></div>
    <div class="in2">
      <h3>Save to <i>folders.</i></h3>
      <p class="lead">Into <b id="outPath"></b>: <b>Photos/</b> and <b>Videos/</b>, one folder per category. Duplicates go to <b>_Duplicates</b>. Nothing is ever deleted.</p>
      <div class="opts">
        <label class="opt"><input type="radio" name="mode" value="copy" checked><b>Copy</b><small>Originals stay put. Safest.</small></label>
        <label class="opt"><input type="radio" name="mode" value="move"><b>Move</b><small>Frees space. Undo once.</small></label>

</div>

<div class="toast" id="toast"><i><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.2 2.2L9.5 3.7"/></svg></i><span></span></div>

<script>
/* =================== constants =================== */
const ROLE_META = {
  hook:      { label: "Hook",      key: "h", c: "#A8382F" },
  "a-roll":  { label: "A-roll",    key: "r", c: "#5E9B76" },
  "b-roll":  { label: "B-roll",    key: "b", c: "#8FA593" },

const FOLDER_ICON = (name) => {

  if (/food|drink/.test(n)) return p('<path d="M7 3v8a2 2 0 002 2v8M11 3v8M15 3c2 0 3 2 3 5s-1 5-3 5v8"/>');
  if (/life/.test(n)) return p('<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>');
  if (/product/.test(n)) return p('<path d="M4 8l8-4 8 4-8 4-8-4z"/><path d="M4 8v8l8 4 8-4V8M12 12v8"/>');
  if (/event/.test(n)) return p('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>');
  if (/nature|aerial|pet/.test(n)) return p('<path d="M3 19l6-9 4 6 3-4 5 7z"/><circle cx="17" cy="6" r="2"/>');
  if (/motion|graphic|logo|brand/.test(n)) return p('<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>');
  if (/screen/.test(n)) return p('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>');
  if (/doc/.test(n)) return p('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>');
  return p('<path d="M3.5 7.5a2 2 0 012-2h4l2 2.2h7a2 2 0 012 2v7.8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/>');
};
const ICON = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg>',
  play: '<svg viewBox="0 0 10 10" fill="currentColor"><path d="M2 1v8l7-4z"/></svg>',
  check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.2 2.2L9.5 3.7"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l7-7"/></svg>',
  soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>',
  replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5v4h4"/></svg>',
  run: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>',
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HEAP_MAX = 30;

const S = {
  data: null, items: [], byId: new Map(), mode: "video",
  sorted: { image: false, video: false }, sorting: false, counts: {},
  folder: null, role: null, type: null, view: null, q: "", sort: "best", tile: 200,
  shown: [], selected: new Set(), focus: -1, anchor: -1, limit: 240, lbOpen: false, sound: false,
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(b >= 1e8 ? 0 : 1) + " MB";
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const dur = s => { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const orient = i => !i.w || !i.h ? null : i.h > i.w * 1.2 ? "vertical" : i.w > i.h * 1.2 ? "horizontal" : "square";
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967295; };
const isDupe = i => !!i.dup_of;
const folders = () => S.data[S.mode === "video" ? "video_folders" : "photo_folders"];
const roles = () => Object.keys(S.data[S.mode === "video" ? "video_roles" : "photo_roles"]);
const roleKey = () => Object.fromEntries(roles().map(r => [ROLE_META[r].key, r]));
const inMode = i => i.kind === S.mode;
const live = () => S.items.filter(i => inMode(i) && !isDupe(i));
const noun = (n) => S.mode === "video" ? (n === 1 ? "clip" : "clips") : (n === 1 ? "photo" : "photos");

/* =================== storage (per-viewer conveniences) =================== */
function prefs(save) {
  try {
    if (save) localStorage.setItem("cull.prefs.v3", JSON.stringify({ sort: S.sort, tile: S.tile, sound: S.sound, theme: document.documentElement.dataset.theme || "", mode: S.mode }));
    else {
      const p = JSON.parse(localStorage.getItem("cull.prefs.v3") || "{}");
      if (p.sort) S.sort = p.sort; if (p.tile) S.tile = p.tile; S.sound = !!p.sound;
      if (p.theme) document.documentElement.dataset.theme = p.theme;
      if (p.mode) S.mode = p.mode;
    }
  } catch (e) {}
}
const sk = m => "cull.sorted:" + (S.data ? S.data.root : "") + ":" + m;
function remember(m, v) { try { v ? localStorage.setItem(sk(m), "1") : localStorage.removeItem(sk(m)); } catch (e) {} }
function recalled(m) { try { return localStorage.getItem(sk(m)) === "1"; } catch (e) { return false; } }

/* =================== data =================== */
async function load() {
  const r = await fetch("/api/data");
  if (!r.ok) throw new Error("server said " + r.status);
  S.data = await r.json();
  S.items = S.data.items;
  S.byId = new Map(S.items.map(i => [i.id, i]));
  $("#libName").textContent = S.data.name;
  $("#outPath").textContent = S.data.root + "/Culled";
  document.title = `${S.data.name} · Cull`;
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Cull": "1" }, body: JSON.stringify(body) });
  return r.json();
}
function folderCounts() { const c = {}; folders().forEach(f => c[f] = 0); live().forEach(i => { if (i.folder in c) c[i.folder]++; }); return c; }

/* =================== small helpers =================== */
function setNum(el, v) { el.textContent = typeof v === "number" ? v.toLocaleString() : v; el.classList.remove("roll"); void el.offsetWidth; el.classList.add("roll"); }
function countTo(el, to, fmt = n => Math.round(n).toLocaleString(), ms = 900) {
  const from = +(el.dataset.v || 0); el.dataset.v = to;
  const put = v => { if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.nodeValue = v; else el.textContent = v; };
  if (reduce || from === to) return put(fmt(to));
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 4); put(fmt(from + (to - from) * e)); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function toast(msg) { const t = $("#toast"); $("span", t).textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1700); }
let actx;
function blip(n, vol = .07) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const sc = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
    const f = 330 * Math.pow(2, sc[n % sc.length] / 12);
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = "triangle"; o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + .06);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .3);
  } catch (e) {}
}
function thud() {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = "sine"; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(48, t + .25);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.0001, t + .35);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .4);
  } catch (e) {}
}

/* =================== header, modes, lockup, strip =================== */
function setStatus(s, txt) { const el = $("#status"); el.dataset.s = s; $(".txt", el).textContent = txt; }
function renderModes() {
  const nv = S.items.filter(i => i.kind === "video" && !isDupe(i)).length, ni = S.items.filter(i => i.kind === "image" && !isDupe(i)).length;
  $("#mVideo").textContent = nv; $("#mImage").textContent = ni;
  $$(".mode").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mode));
  const on = $(".mode.on"), bar = $("#modeBar");
  if (on) { bar.style.left = on.offsetLeft + "px"; bar.style.width = on.offsetWidth + "px"; }
}
function setLockup(animate = true) {
  const sorted = S.sorted[S.mode];
  const [a, b] = sorted
    ? (S.mode === "video" ? ["every clip,", "in its place."] : ["every photo,", "in its place."])
    : (S.mode === "video" ? ["my footage is", '<span class="ox">≈</span> a total mess.'] : ["my camera roll is", '<span class="ox">≈</span> a total mess.']);
  const cls = animate && !reduce ? " in" : "";
  $("#lockup").innerHTML = `<span class="l1 line${cls}">${a}</span><span class="l2 line${cls}">${b}</span>`;
  $("#winTitle").textContent = (S.mode === "video" ? "sort_videos.exe" : "sort_photos.exe") + ` — ${S.data.name}`;
}
function renderStrip() {
  const L = live(), dupes = S.items.filter(i => inMode(i) && isDupe(i)), free = dupes.reduce((n, i) => n + i.size, 0);
  const sortedN = Object.values(S.counts).reduce((a, b) => a + b, 0);
  const cells = S.mode === "video" ? [
    ["Clips", L.length.toLocaleString()],
    ["Total length", dur(L.reduce((n, i) => n + (i.duration || 0), 0))],
    ["Vertical 9:16", L.filter(i => orient(i) === "vertical").length.toLocaleString()],
    ["Sorted", `<span id="nSorted">${sortedN}</span>`],
    ["Duplicates", `${dupes.length}${free ? `<small>${mb(free)}</small>` : ""}`],
  ] : [
    ["Photos", L.length.toLocaleString()],
    ["Labelled by Claude", L.filter(i => i.labelled).length.toLocaleString()],
    ["Similar shots", L.filter(i => i.near_of || i.burst).length.toLocaleString()],
    ["Sorted", `<span id="nSorted">${sortedN}</span>`],
    ["Duplicates", `${dupes.length}${free ? `<small>${mb(free)}</small>` : ""}`],
  ];
  const sorted = S.sorted[S.mode];
  const btn = S.sorting ? `<button class="run" id="runBtn" disabled><span class="spin"></span>Sorting…</button>`
    : sorted ? `<button class="run save" id="runBtn">${ICON.save}Save to folders</button>`
      : `<button class="run" id="runBtn" ${L.some(i => i.folder) ? "" : "disabled"}>${ICON.run}Run sort</button>`;
  $("#strip").innerHTML = cells.map(([l, n]) => `<div class="cell"><div class="l">${l}</div><div class="n">${n}</div></div>`).join("") + btn +
    (sorted && !S.sorting ? `<button class="replay" id="replayBtn" title="Run the sort again">${ICON.replay}</button>` : "");
}
function bumpSorted() { const el = $("#nSorted"); if (el) setNum(el, Object.values(S.counts).reduce((a, b) => a + b, 0)); }

/* =================== nodes & wires =================== */
function nodeThumbs(f) {
  const best = live().filter(i => i.folder === f && i.thumb).sort((a, b) => (b.quality || 0) - (a.quality || 0)).slice(0, 3);
  return best.map(i => `<img src="/thumb/${i.id}" alt="">`).join("");
}
function renderNodes() {
  const fs = folders(), half = Math.ceil(fs.length / 2), sorted = S.sorted[S.mode];
  const node = (f, k) => {
    const n = S.counts[f] || 0;
    return `<button class="node ${n ? "" : "zero"} ${S.folder === f ? "on" : ""}" data-folder="${esc(f)}"><span class="led"></span><span class="ic">${FOLDER_ICON(f)}</span><span class="meta"><div class="t">${esc(f)}</div><div class="c"><b>${n}</b><span>${noun(n)}</span></div></span><span class="thumbs">${sorted ? nodeThumbs(f) : ""}</span><span class="k">${k < 10 ? (k + 1) % 10 : ""}</span></button>`;
  };
  $("#colL").innerHTML = fs.slice(0, half).map((f, k) => node(f, k)).join("");
  $("#colR").innerHTML = fs.slice(half).map((f, k) => node(f, k + half)).join("");
  requestAnimationFrame(drawWires);
}
const nodeEl = f => $$(".node").find(el => el.dataset.folder === f);
function anchor(el, stageRect) {
  const r = el.getBoundingClientRect();
  const left = el.closest("#colL") !== null;
  return { x: (left ? r.right : r.left) - stageRect.left, y: r.top + r.height / 2 - stageRect.top };
}
function curve(a, b) {
  const dx = b.x - a.x;
  return [a, { x: a.x + dx * .45, y: a.y }, { x: b.x - dx * .45, y: b.y }, b];
}
function drawWires() {
  const svg = $("#wires"), st = $("#stage").getBoundingClientRect();
  if (getComputedStyle(svg).display === "none") return;
  const hb = $("#heapbox").getBoundingClientRect();
  const c = { x: hb.left + hb.width / 2 - st.left, y: hb.top + hb.height / 2 - 20 - st.top };
  const sorted = S.sorted[S.mode];
  svg.innerHTML = $$(".node").map(el => {
    const a = anchor(el, st);
    const from = { x: c.x + (a.x < c.x ? -70 : 70), y: c.y };
    const [p0, p1, p2, p3] = curve(from, a);
    const n = S.counts[el.dataset.folder] || 0;
    return `<path data-f="${esc(el.dataset.folder)}" class="${sorted && n ? "done" : ""}" d="M${p0.x},${p0.y} C${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}"/><circle cx="${p3.x}" cy="${p3.y}" r="3"/>`;
  }).join("") + `<circle cx="${c.x - 70}" cy="${c.y}" r="3"/><circle cx="${c.x + 70}" cy="${c.y}" r="3"/>`;
}
const wire = f => $$("#wires path").find(p => p.dataset.f === f);

/* =================== heap =================== */
function heapPool() { return [...(S.sorted[S.mode] ? live().filter(i => !i.folder) : live())].sort((a, b) => hash(a.id) - hash(b.id)); }
function renderHeap(intro = true) {
  const pool = heapPool(), show = pool.slice(0, HEAP_MAX), heap = $("#heap");
  $$(".stamp, .after", $("#heapbox")).forEach(e => e.remove());
  if (!pool.length && S.sorted[S.mode]) {
    heap.innerHTML = ""; $("#heapnote").innerHTML = "";
    stamp(false);
    return;
  }
  heap.innerHTML = show.map((i, k) => {
    const a = hash(i.id + "a") * Math.PI * 2, rad = 14 + hash(i.id + "r") * 80;
    const x = Math.round(Math.cos(a) * rad * 1.15), y = Math.round(Math.sin(a) * rad * .7);
    const r = Math.round(hash(i.id + "t") * 44 - 22);
    const cap = i.kind === "video" ? `${ICON.play}${dur(i.duration)}${orient(i) === "vertical" ? " · 9:16" : ""}` : esc(i.name.replace(/\.[^.]+$/, ""));
    return `<div class="pol" data-id="${i.id}" style="--x:${x}px;--y:${y}px;--r:${r}deg;--d:${intro && !reduce ? k * 35 : 0}ms;z-index:${k}"><div class="im">${i.thumb ? `<img src="/thumb/${i.id}" alt="">` : ""}</div><div class="cap2">${cap}</div></div>`;
  }).join("");
  if (!intro) $$(".pol", heap).forEach(p => p.style.animation = "none");
  const unl = pool.filter(i => !i.labelled).length;
  $("#heapnote").innerHTML = S.sorted[S.mode]
    ? `<b>${pool.length}</b> ${noun(pool.length)} Claude hasn’t looked at yet`
    : pool.length ? `${pool.length > HEAP_MAX ? `<b>+${pool.length - HEAP_MAX}</b> underneath · ` : ""}${unl ? `<b>${unl}</b> not labelled yet` : `Press <b>Run sort</b>`}` : `No ${noun(2)} here`;
}
function stamp(animate) {
  const box = $("#heapbox");
  const L = live(), used = new Set(L.map(i => i.folder).filter(Boolean)).size;
  const st = document.createElement("div");
  st.className = "stamp" + (animate && !reduce ? " thump" : "");
  st.innerHTML = `<div class="big">Sorted</div><div class="sm">${plural(L.length, noun(1))} · ${used} folders</div>`;
  box.appendChild(st);
  const af = document.createElement("div");
  af.className = "after"; af.textContent = "Click a folder to look inside ↓";
  box.appendChild(af);
  if (animate && !reduce) { setTimeout(() => { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); thud(); }, 330); }
}

/* =================== THE SORT =================== */
function bez(p, t) {
  const u = 1 - t;
  return { x: u * u * u * p[0].x + 3 * u * u * t * p[1].x + 3 * u * t * t * p[2].x + t * t * t * p[3].x, y: u * u * u * p[0].y + 3 * u * u * t * p[1].y + 3 * u * t * t * p[2].y + t * t * t * p[3].y };
}
function fly(pol, item, node, delay) {
  return new Promise(res => {
    const r = pol.getBoundingClientRect();
    const rot = parseFloat(pol.style.getPropertyValue("--r")) || 0;
    const w = pol.offsetWidth, h = pol.offsetHeight;
    const start = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    const nr = node.getBoundingClientRect(), left = node.closest("#colL") !== null;
    const end = { x: left ? nr.right - 30 : nr.left + 30, y: nr.top + nr.height / 2 };
    const dx = end.x - start.x;
    const mid = Math.min(start.y, end.y) - 60 - Math.abs(dx) * .08;
    const path = [start, { x: start.x + dx * .15, y: mid }, { x: end.x - dx * .35, y: mid + (end.y - mid) * .2 }, end];
    const el = document.createElement("div");

function showHelp() {
  const rk = roles().map(r => ROLE_META[r].key).join("  ");
  const rows = [["← → ↑ ↓", "Move between files"], ["Shift + arrows", "Select a range"], ["⌘/Ctrl + click", "Add to the selection"], ["Space", "Big preview"], ["1 – 9  0", "Move to folder 1–10"], [rk, roles().map(r => ROLE_META[r].label).join(", ")], ["s", "Star"], ["Shift + A", "Select everything shown"], ["/", "Search"], ["Esc", "Close or clear"]];
  $("#helpRows").innerHTML = rows.map(([k, t]) => `<tr><td>${k.split("  ").map(x => `<kbd>${x}</kbd>`).join(" ")}</td><td>${t}</td></tr>`).join("");
  $("#helpModal").classList.add("show");
}
$("#saveGo").onclick = async () => {
  const mode = $("input[name=mode]:checked").value;
  if (mode === "move" && !confirm("Move your original files into the sorted folders? You can undo this once.")) return;
  const btn = $("#saveGo"); btn.disabled = true;
  const r = await post("/api/apply", { mode, skip_rejects: $("#skipRejects").checked, near_as_dupes: $("#nearDupes").checked });
  btn.disabled = false;
  if (!r.ok) { $("#result").innerHTML = `<div class="note">${esc(r.error || "Something went wrong")}</div>`; return; }
  const max = Math.max(1, ...Object.values(r.folders));
  $("#result").innerHTML = `<div class="done"><i>${ICON.check}</i>${r.mode === "move" ? "Moved" : "Copied"} ${plural(r.files, "file")}</div>` + Object.entries(r.folders).sort((a, b) => b[1] - a[1]).map(([k, v], ix) => `<div class="rbar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${v / max * 100}%;animation-delay:${ix * 50}ms"></span></span><span>${v}</span></div>`).join("");
  if (r.mode === "move") { $("#undoBtn").hidden = false; await load(); afterEdit(); }
};
$("#undoBtn").onclick = async () => { const r = await post("/api/undo", {}); $("#result").innerHTML = `<div class="done">${r.ok ? `Put ${plural(r.restored, "file")} back.` : esc(r.error)}</div>`; $("#undoBtn").hidden = true; await load(); afterEdit(); };

/* =================== theme & sound =================== */
function paintIcons() { const paper = document.documentElement.dataset.theme === "paper"; $("#themeBtn").innerHTML = paper ? ICON.leaf : ICON.sun; $("#themeBtn").title = paper ? "Forest theme" : "Paper theme"; $("#soundBtn").innerHTML = S.sound ? ICON.soundOn : ICON.soundOff; $("#soundBtn").classList.toggle("on", S.sound); }
$("#themeBtn").onclick = () => { const r = document.documentElement; if (r.dataset.theme === "paper") delete r.dataset.theme; else r.dataset.theme = "paper"; paintIcons(); prefs(true); };
$("#soundBtn").onclick = () => { S.sound = !S.sound; paintIcons(); prefs(true); if (S.sound) blip(4); toast(S.sound ? "Sound on" : "Sound off"); };

/* =================== events =================== */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#runBtn")) return runSort();
  if (t.closest("#replayBtn")) return replay();
  const md = t.closest(".mode"); if (md) return switchMode(md.dataset.mode);
  const star = t.closest("[data-star]"); if (star) { e.stopPropagation(); return toggleStar([star.closest(".tile").dataset.id]); }
  const tile = t.closest(".tile");
  if (tile) {
    const idx = +tile.dataset.idx;
    if (e.shiftKey) return setFocus(idx, { range: true });
    if (e.metaKey || e.ctrlKey) return setFocus(idx, { toggle: true });
    if (S.selected.size > 1) S.selected.clear();
    S.focus = idx; S.anchor = idx; marks(); return showLightbox(idx);
  }
  const nd = t.closest(".node");
  if (nd) {
    const f = nd.dataset.folder; S.folder = S.folder === f ? null : f; S.selected.clear(); S.focus = -1; S.limit = 240;
    $$(".node").forEach(c => c.classList.toggle("on", c.dataset.folder === S.folder));
    renderLib(true); if (S.folder !== null) $("#lib").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    return;
  }
  if (t.closest("[data-unfolder]")) { S.folder = null; $$(".node").forEach(c => c.classList.remove("on")); return renderLib(true); }
  const seg = t.closest("#seg button");
  if (seg) { S.role = seg.dataset.role || null; S.selected.clear(); S.focus = -1; S.limit = 240; $$("#seg button").forEach(b => b.classList.toggle("on", b === seg)); slide(); renderGrid(true); marks(); return; }
  const ty = t.closest("[data-type]"); if (ty) { S.type = S.type === ty.dataset.type ? null : ty.dataset.type; S.focus = -1; S.selected.clear(); return renderLib(true); }
  const vw = t.closest("[data-view]"); if (vw) { S.view = S.view === vw.dataset.view ? null : vw.dataset.view; S.focus = -1; S.selected.clear(); return renderLib(true); }
  if (t.closest("[data-setrole]")) return setRole(t.closest("[data-setrole]").dataset.setrole);
  if (t.closest("[data-setq]")) return setQuality(+t.closest("[data-setq]").dataset.setq);
  const tag = t.closest("[data-tag]"); if (tag) { closeLightbox(); $("#search").value = tag.dataset.tag; S.q = tag.dataset.tag.toLowerCase(); renderLib(true); $("#lib").scrollIntoView({ behavior: "smooth" }); return; }
  if (t.closest("#prev") || t.closest("#prevT")) return setFocus(S.focus - 1);
  if (t.closest("#next") || t.closest("#nextT")) return setFocus(S.focus + 1);
  if (t.closest("[data-lbx]") || t.matches("[data-lbclose]")) return closeLightbox();
  if (t.closest("[data-close]")) return closeModals();
  if (t.closest("#helpBtn")) return showHelp();
});
document.addEventListener("change", e => {
  if (e.target.id === "sortSel") { S.sort = e.target.value; prefs(true); renderGrid(true); marks(); }
  if (e.target.matches("[data-setfolder]") && e.target.value) setFolder(e.target.value);
  if (e.target.id === "dockFolder" && e.target.value) { setFolder(e.target.value); e.target.value = ""; }
});
document.addEventListener("input", e => {
  if (e.target.id === "sizeSel") { S.tile = +e.target.value; document.documentElement.style.setProperty("--tile", S.tile + "px"); prefs(true); }
  if (e.target.id === "search") { clearTimeout(S._q); S._q = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); S.limit = 240; S.focus = -1; renderLib(true); if (S.q) $("#lib").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); }, 160); }
});
$("#dockStar").onclick = () => toggleStar();
$("#dockClear").onclick = () => { S.selected.clear(); marks(); };
$("#dockTag").addEventListener("keydown", e => { if (e.key === "Enter") { addTag(e.target.value); e.target.value = ""; e.target.blur(); } });
$("#searchWrap").addEventListener("click", () => { if (S.selected.size) { S.selected.clear(); marks(); $("#search").focus(); } });
let rz; addEventListener("resize", () => { slide(false); renderModes(); clearTimeout(rz); rz = setTimeout(drawWires, 60); });

document.addEventListener("keydown", e => {
  if (!S.data) return;
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tiles = $$(".tile"); let cols = 1;
  if (tiles.length > 1) { const y0 = tiles[0].offsetTop; cols = tiles.findIndex(el => el.offsetTop !== y0); if (cols < 1) cols = tiles.length; }
  const f = S.focus, mode = e.shiftKey ? { range: true } : S.selected.size > 1 ? { keep: true } : { only: true };
  switch (e.key) {
    case "ArrowRight": e.preventDefault(); return setFocus(f + 1, mode);
    case "ArrowLeft": e.preventDefault(); return setFocus(Math.max(0, f - 1), mode);
    case "ArrowDown": if (S.lbOpen) return; e.preventDefault(); return setFocus(f < 0 ? 0 : f + cols, mode);
    case "ArrowUp": if (S.lbOpen) return; e.preventDefault(); return setFocus(Math.max(0, f - cols), mode);
    case " ": case "Enter": e.preventDefault(); if (S.lbOpen) return closeLightbox(); return S.focus >= 0 && showLightbox(S.focus);
    case "Escape": if ($(".modal.show")) return closeModals(); if (S.lbOpen) return closeLightbox(); S.selected.clear(); marks(); return;
    case "/": e.preventDefault(); if (S.selected.size) { S.selected.clear(); marks(); } return $("#search").focus();
    case "?": return showHelp();
    case "A": S.shown.slice(0, S.limit).forEach(i => S.selected.add(i.id)); marks(); return;
    case "s": return toggleStar();
  }
  if (/^[0-9]$/.test(e.key)) { const fo = folders()[e.key === "0" ? 9 : +e.key - 1]; if (fo) setFolder(fo); return; }
  const rk = roleKey(); if (rk[e.key]) setRole(rk[e.key]);
});
function fillDock() {
  $("#dockFolder").innerHTML = `<option value="">Move to…</option>` + folders().map((f, k) => `<option value="${esc(f)}">${k < 10 ? (k + 1) % 10 + "  " : ""}${esc(f)}</option>`).join("");
  $("#dockRoles").innerHTML = roles().map(r => `<button data-setrole="${r}"><span class="dotc" style="--c:${ROLE_META[r].c}"></span>${ROLE_META[r].label}</button>`).join("");
}

/* =================== boot =================== */
prefs(); paintIcons();
document.documentElement.style.setProperty("--tile", S.tile + "px");
load().then(() => {
  const hasV = S.items.some(i => i.kind === "video"), hasI = S.items.some(i => i.kind === "image");
  if (S.mode === "video" && !hasV && hasI) S.mode = "image";
  if (S.mode === "image" && !hasI && hasV) S.mode = "video";
  ["image", "video"].forEach(m => { const saved = S.mode; S.mode = m; S.sorted[m] = recalled(m) && live().some(i => i.folder); S.mode = saved; });
  S.counts = S.sorted[S.mode] ? folderCounts() : {};
  setStatus(S.sorted[S.mode] ? "done" : "idle", S.sorted[S.mode] ? "Sorted" : live().some(i => i.labelled) ? "Ready" : "Waiting for Claude");
  renderModes(); setLockup(true); renderStrip(); renderNodes(); renderHeap(true); fillDock(); renderLib(true);
  if (document.fonts) document.fonts.ready.then(() => { renderModes(); drawWires(); slide(false); });
}).catch(err => {
  $("#lockup").innerHTML = `<span class="l1">can’t reach</span><span class="l2">the server.</span>`;
  setStatus("idle", "Offline");
  $("#grid").innerHTML = `<div class="nothing"><b>Is it running?</b>Start it again from Claude Code (${esc(err.message)})</div>`;
});
</script>
</body>
</html>
