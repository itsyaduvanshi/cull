<html lang="en">

<style>
:root {
  --paper: #F4EEE3; --paper-2: #EEE6D7; --card: #FBF8F2; --sunk: #EAE1D0;
  --line: #E2D8C5; --line-2: #D3C5AC;
  --ink: #241C15; --ink-2: #6F6253; --ink-3: #A5977F;
  --green: #2F5641; --green-2: #3F6E54; --green-soft: #DCE5D7;
  --red: #7E2320; --red-2: #962C27; --red-soft: #F0DCD3;
  --hl: #E5CB9E;
  --dock: #241C15; --dock-ink: #F4EEE3;
  --glow: rgba(126,35,32,.10);
  --shadow-1: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.07);
  --shadow-2: 0 18px 50px rgba(60,40,20,.18);
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, serif;
  --tile: 190px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14110D; --paper-2: #1A1612; --card: #1E1914; --sunk: #26201A;
    --line: #2E271F; --line-2: #3D3428;
    --ink: #F2EADC; --ink-2: #B4A68E; --ink-3: #7A6D5B;
    --green: #86B096; --green-2: #9CC2AA; --green-soft: #22302A;
    --red: #D46B5E; --red-2: #E07D70; --red-soft: #3A1F1B;
    --hl: rgba(212,107,94,.42);
    --dock: #F2EADC; --dock-ink: #1A1612;
    --glow: rgba(212,107,94,.14);
    --shadow-1: 0 1px 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.35);
    --shadow-2: 0 24px 60px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14110D; --paper-2: #1A1612; --card: #1E1914; --sunk: #26201A;
  --line: #2E271F; --line-2: #3D3428;
  --ink: #F2EADC; --ink-2: #B4A68E; --ink-3: #7A6D5B;
  --green: #86B096; --green-2: #9CC2AA; --green-soft: #22302A;
  --red: #D46B5E; --red-2: #E07D70; --red-soft: #3A1F1B;
  --hl: rgba(212,107,94,.42);
  --dock: #F2EADC; --dock-ink: #1A1612;
  --glow: rgba(212,107,94,.14);
  --shadow-1: 0 1px 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.35);
  --shadow-2: 0 24px 60px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: radial-gradient(1100px 600px at 50% -8%, color-mix(in srgb, var(--hl) 45%, transparent), transparent 70%), var(--paper);
  background-attachment: fixed;
  color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh;
  transition: background-color .3s, color .3s;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 28px; }
kbd { font: 600 10.5px/1 var(--font); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--paper-2); color: var(--ink-2); }

/* header */
.top .wrap { display: flex; align-items: center; gap: 10px; padding-top: 18px; padding-bottom: 6px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.logo i { width: 30px; height: 30px; border-radius: 9px; background: var(--red); display: grid; place-items: center; transition: transform .5s var(--spring); box-shadow: 0 2px 8px color-mix(in srgb, var(--red) 35%, transparent); }
.logo:hover i { transform: rotate(-8deg) scale(1.06); }
.logo i svg { width: 18px; height: 18px; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 70%, transparent); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.pill svg { width: 14px; height: 14px; flex: none; }
.status .d { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.status[data-s="busy"] .d { background: var(--red); animation: pulse 1.2s infinite; }
.status[data-s="done"] .d { background: var(--green); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
.grow { flex: 1; }
.icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 70%, transparent); transition: all .2s; }
.icon:hover { color: var(--ink); background: var(--card); }
.icon svg { width: 16px; height: 16px; }
.icon.on { color: var(--red); }

/* headline */
.headline { margin: 18px 0 18px; font-size: clamp(34px, 5.2vw, 60px); line-height: 1.02; letter-spacing: -.04em; font-weight: 700; }
.headline em { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: -.025em; position: relative; z-index: 0; white-space: nowrap; padding: 0 .06em; }
.headline em::before { content: ""; position: absolute; z-index: -1; left: -.02em; right: -.04em; top: .5em; bottom: .02em; background: var(--hl); border-radius: .12em .3em .18em .35em; transform: rotate(-1.2deg) scaleX(0); transform-origin: left; animation: marker .8s .25s var(--ease) forwards; }
@keyframes marker { to { transform: rotate(-1.2deg) scaleX(1); } }
.headline .swap { display: inline-block; animation: rise .6s var(--ease) both; }

/* strip */
.strip { display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: var(--shadow-1); }
.cell { flex: 1; padding: 9px 16px; border-right: 1px solid var(--line); min-width: 0; }
.cell:nth-last-child(2) { border-right: 0; }
.cell .l { font-size: 12px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.cell .n { font-size: 24px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.cell .n small { font-size: 13px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.sort { flex: none; display: inline-flex; align-items: center; gap: 9px; padding: 0 26px; border-radius: 17px; background: var(--red); color: #FBF3E8; font-weight: 600; font-size: 15px; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(80,10,10,.25), 0 8px 22px color-mix(in srgb, var(--red) 35%, transparent); transition: transform .2s var(--spring), background .2s, box-shadow .2s; white-space: nowrap; }
:root[data-theme="dark"] .sort { color: #1A0F0C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sort { color: #1A0F0C; } }
.sort:hover { background: var(--red-2); transform: translateY(-1px); }
.sort:active { transform: scale(.97); }
.sort:disabled { opacity: .7; cursor: default; transform: none; }
.sort svg { width: 17px; height: 17px; }
.sort.save { background: var(--green); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 22px color-mix(in srgb, var(--green) 30%, transparent); }
.sort.save:hover { background: var(--green-2); }
.spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: currentColor; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.replay { margin-left: 6px; }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 1.25fr) minmax(0, 1fr); gap: 22px; margin: 26px 0 10px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.fcard { display: flex; align-items: center; gap: 12px; text-align: left; padding: 9px 12px 9px 9px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); transition: transform .3s var(--ease), box-shadow .3s, border-color .2s, background .3s; position: relative; min-width: 0; }
.fcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-1); }
.fcard.on { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
.fcard.zero { background: color-mix(in srgb, var(--card) 45%, transparent); border-style: dashed; }
.fcard.zero .fan { opacity: .6; }
.fcard.bump { animation: bump .45s var(--spring); }
@keyframes bump { 35% { transform: scale(1.045); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 25%, transparent); } }
.fan { position: relative; width: 62px; height: 50px; flex: none; border-radius: 11px; background: var(--sunk); }
.fan img { position: absolute; width: 32px; height: 40px; top: 5px; left: 15px; object-fit: cover; border-radius: 6px; border: 2px solid var(--card); box-shadow: 0 2px 6px rgba(40,20,10,.2); transition: transform .45s var(--spring); }
.fan img:nth-last-child(3) { transform: rotate(-12deg) translateX(-12px); }
.fan img:nth-last-child(2) { transform: rotate(10deg) translateX(12px); }
.fan img:nth-last-child(1) { transform: translateY(-1px); z-index: 2; }
.fcard:hover .fan img:nth-last-child(3) { transform: rotate(-18deg) translateX(-17px) translateY(2px); }
.fcard:hover .fan img:nth-last-child(2) { transform: rotate(16deg) translateX(17px) translateY(2px); }
.fan .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
.fan .ph svg { width: 20px; height: 20px; }
.fcard .meta { min-width: 0; flex: 1; }
.fcard .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.fcard .c { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fcard .c b { color: var(--ink); font-weight: 600; }
.fcard kbd { flex: none; }

.heapbox { position: relative; height: 420px; display: grid; place-items: center; }
.heapbox::before { content: ""; position: absolute; inset: 8% 4%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow), transparent); filter: blur(6px); }
.heapbox::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 40px; height: 18px; border-radius: 50%; background: radial-gradient(closest-side, rgba(60,30,10,.18), transparent); transition: opacity .5s; }
.heapbox.clear::after { opacity: 0; }
.heap { position: relative; width: 300px; height: 300px; animation: sway 9s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-2.5deg) translateY(0); } 50% { transform: rotate(2.5deg) translateY(-6px); } }
.chip-photo { position: absolute; left: 50%; top: 50%; width: 96px; height: 120px; margin: -60px 0 0 -48px; border-radius: 10px; overflow: hidden; background: var(--sunk); border: 3px solid var(--card); box-shadow: 0 6px 18px rgba(50,25,10,.22); transform: translate(var(--x), var(--y)) rotate(var(--r)); animation: land .7s var(--spring) both; animation-delay: var(--d); }
@keyframes land { from { opacity: 0; transform: translate(calc(var(--x) * .2), -220px) rotate(calc(var(--r) * -1.5)); } }
.chip-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.chip-photo .vb { position: absolute; left: 5px; bottom: 5px; font-size: 10px; font-weight: 600; color: #fff; background: rgba(20,12,8,.6); border-radius: 5px; padding: 1px 5px; display: flex; align-items: center; gap: 3px; }
.chip-photo .vb svg { width: 8px; height: 8px; }
.heapnote { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--ink-2); }
.heapnote b { color: var(--ink); }
.allset { text-align: center; animation: rise .6s var(--ease) both; }
.allset .ok { width: 58px; height: 58px; border-radius: 50%; margin: 0 auto 12px; background: var(--green); color: var(--paper); display: grid; place-items: center; animation: pop .6s var(--spring) both; }
.allset .ok svg { width: 26px; height: 26px; }
.allset p { margin: 0; color: var(--ink-2); font-size: 14px; }
.allset b { display: block; font-size: 20px; color: var(--ink); letter-spacing: -.02em; margin-bottom: 2px; }
.flying { position: fixed; z-index: 90; border-radius: 10px; overflow: hidden; border: 3px solid var(--card); box-shadow: 0 10px 28px rgba(50,25,10,.28); pointer-events: none; background: var(--sunk); }
.flying img { width: 100%; height: 100%; object-fit: cover; display: block; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* browse */
.browse { margin-top: 34px; padding-bottom: 140px; }
.bhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.bhead h2 { margin: 0; font-size: 28px; letter-spacing: -.035em; font-weight: 700; }
.bhead h2 em { font-family: var(--serif); font-weight: 400; }
.crumb { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--green); color: var(--paper); font-size: 13px; font-weight: 500; }
.crumb button { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); }
.crumb svg { width: 10px; height: 10px; }
.bhead .cnt { color: var(--ink-2); font-size: 14px; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.seg { display: inline-flex; position: relative; background: var(--paper-2); border: 1px solid var(--line); border-radius: 13px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; z-index: 1; height: 30px; padding: 0 11px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: color .2s; }
.seg button.on { color: var(--ink); }
.seg button .k { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.seg .slider { position: absolute; z-index: 0; top: 3px; height: 30px; border-radius: 10px; background: var(--card); box-shadow: 0 1px 2px rgba(60,40,20,.1), 0 2px 8px rgba(60,40,20,.06); transition: left .35s var(--ease), width .35s var(--ease); }
.dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.chip { height: 32px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 60%, transparent); font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; transition: all .2s; white-space: nowrap; }
.chip:hover { color: var(--ink); border-color: var(--line-2); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .k { font-size: 11.5px; opacity: .6; }
.chip svg { width: 13px; height: 13px; }
.selw { position: relative; }
.selw select { appearance: none; height: 32px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); padding: 0 30px 0 12px; font-size: 13px; cursor: pointer; }
.selw::after { content: ""; position: absolute; right: 12px; top: 12px; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); pointer-events: none; }
.range { width: 86px; accent-color: var(--red); }
.notice { display: flex; gap: 12px; align-items: center; background: var(--red-soft); color: var(--ink); border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; animation: rise .5s var(--ease) both; }
.notice svg { width: 18px; height: 18px; color: var(--red); flex: none; }
.notice code { font: 12px ui-monospace, monospace; background: color-mix(in srgb, var(--card) 70%, transparent); padding: 2px 6px; border-radius: 6px; word-break: break-all; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--tile), 42vw), 1fr)); gap: 12px; }
.tile { position: relative; margin: 0; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: var(--sunk); cursor: pointer; isolation: isolate; transition: transform .3s var(--ease), box-shadow .3s; }
.tile.anim { animation: rise .55s var(--ease) both; animation-delay: calc(min(var(--i), 28) * 20ms); }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-1); }
.tile > img, .tile > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease), opacity .35s; }
.tile > img { opacity: 0; }
.tile > img.ok { opacity: 1; }
.tile > video { opacity: 0; }
.tile > video.ok { opacity: 1; }
.tile:hover > img { transform: scale(1.04); }
.tile.alpha { background-color: var(--card); background-image: conic-gradient(var(--sunk) 25%, transparent 0 50%, var(--sunk) 0 75%, transparent 0); background-size: 18px 18px; }
.tile.alpha > img { object-fit: contain; padding: 14%; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; transition: box-shadow .18s; z-index: 4; }
.tile.sel::after { box-shadow: inset 0 0 0 3px var(--green); }
.tile.focus::after { box-shadow: inset 0 0 0 2px var(--ink); }
.tile.sel.focus::after { box-shadow: inset 0 0 0 3px var(--green), inset 0 0 0 5px var(--card); }
.tile.reject > img { filter: grayscale(.8) sepia(.2) brightness(.85); opacity: .6; }
.shade { position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(transparent, rgba(20,10,5,.66)); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 1; }
.tile:hover .shade, .tile.focus .shade { opacity: 1; }
.cap { position: absolute; left: 12px; right: 12px; bottom: 36px; color: #fff; font-size: 12px; line-height: 1.35; opacity: 0; transform: translateY(6px); transition: all .3s var(--ease); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none; z-index: 2; }
.tile:hover .cap { opacity: 1; transform: none; }
.rtag { position: absolute; left: 9px; bottom: 9px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; height: 23px; padding: 0 9px 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: #FBF3E8; background: rgba(28,16,10,.58); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.qbar { position: absolute; right: 10px; bottom: 16px; display: flex; gap: 2px; z-index: 2; }
.qbar i { width: 9px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); }
.qbar i.on { background: #FBF3E8; }
.vbadge { position: absolute; left: 9px; top: 9px; z-index: 2; display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: #FBF3E8; background: rgba(28,16,10,.58); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }
.vbadge svg { width: 9px; height: 9px; }
.flag { position: absolute; right: 44px; top: 9px; z-index: 2; height: 23px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; background: var(--hl); color: #3A2A14; }
.flag.dupe { background: var(--red); color: #FBF3E8; }
.flag.left { right: auto; left: 9px; }
.starb { position: absolute; right: 8px; top: 8px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #FBF3E8; opacity: 0; transform: scale(.8); transition: all .25s var(--spring); background: rgba(28,16,10,.38); backdrop-filter: blur(6px); }
.tile:hover .starb { opacity: 1; transform: none; }
.starb.on { opacity: 1; transform: none; color: #F2B84B; }
.starb svg { width: 15px; height: 15px; }
.starb.pop { animation: pop .45s var(--spring); }
.novid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 12px; text-align: center; padding: 12px; }
.nothing { grid-column: 1 / -1; text-align: center; padding: 70px 0; color: var(--ink-3); }
.nothing b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }
.more { grid-column: 1 / -1; height: 1px; }

/* dock */
.dock { position: fixed; left: 50%; bottom: 20px; z-index: 40; transform: translateX(-50%); background: var(--dock); color: var(--dock-ink); border-radius: 18px; padding: 6px; display: flex; align-items: center; gap: 4px; box-shadow: var(--shadow-2); max-width: calc(100vw - 24px); }
.dock .search { display: flex; align-items: center; gap: 9px; padding: 0 8px 0 12px; height: 40px; width: 420px; max-width: calc(100vw - 40px); transition: width .4s var(--ease); }
.dock .search svg { width: 16px; height: 16px; opacity: .6; flex: none; }
.dock .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--dock-ink); font-size: 14px; }
.dock .search input::placeholder { color: color-mix(in srgb, var(--dock-ink) 50%, transparent); }
.dock .search kbd { background: color-mix(in srgb, var(--dock-ink) 12%, transparent); border-color: transparent; color: color-mix(in srgb, var(--dock-ink) 70%, transparent); }
.dock .acts { display: none; align-items: center; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.dock .acts::-webkit-scrollbar { display: none; }
.dock.sel .acts { display: flex; animation: rise .35s var(--ease); }

.dock .acts button:hover { background: color-mix(in srgb, var(--dock-ink) 12%, transparent); }

.dock .acts input { width: 84px; background: color-mix(in srgb, var(--dock-ink) 10%, transparent); outline: none; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-columns: 1fr 370px; visibility: hidden; }

.lb .rb { position: absolute; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.1); color: #F4EEE3; display: grid; place-items: center; z-index: 2; transition: background .2s; }
.lb .rb:hover { background: rgba(255,255,255,.2); }
.lb .rb svg { width: 18px; height: 18px; }
.lb .x { top: 18px; left: 18px; }
.lb .prev { left: 18px; top: 50%; margin-top: -21px; }
.lb .next { right: 18px; top: 50%; margin-top: -21px; }
.side h3 { margin: 0; font-size: 17px; letter-spacing: -.02em; word-break: break-all; }
.side .path { color: var(--ink-3); font-size: 12px; margin: 3px 0 16px; word-break: break-all; }
.side .caption { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.3; margin: 0 0 16px; }
.side .note { font-size: 13px; color: var(--ink); background: var(--red-soft); border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }
.side h5 { margin: 18px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.roles button { height: 34px; border-radius: 10px; border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; transition: all .2s; }
.roles button:hover { border-color: var(--line-2); background: var(--paper-2); }
.roles button.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.roles button kbd { margin-left: auto; }
.roles button.on kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--paper) 40%, transparent); }
.fsel select { width: 100%; }
.qpick { display: flex; gap: 4px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }

.sheet { position: relative; border-radius: 10px; overflow: hidden; cursor: pointer; }

.hookbtn { margin-top: 8px; width: 100%; height: 36px; border-radius: 10px; background: var(--red); color: #FBF3E8; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 7px; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; visibility: hidden; }

.modal .bg { position: absolute; inset: 0; background: rgba(20,14,10,.5); backdrop-filter: blur(6px); opacity: 0; transition: opacity .3s; }

.modal.show .card { opacity: 1; transform: none; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.opt { border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; transition: all .2s; position: relative; }
.opt input { position: absolute; opacity: 0; }
.opt b { display: block; font-size: 15px; margin-bottom: 2px; }
.opt small { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; display: block; }
.opt:has(input:checked) { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); background: color-mix(in srgb, var(--green-soft) 50%, transparent); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.toggle input { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; transition: background .25s; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s var(--spring); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--green); }
.toggle input:checked::after { transform: translateX(16px); }
.row { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
.btn { height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; transition: all .15s; white-space: nowrap; }
.btn:hover { background: var(--paper-2); }
.btn.go { background: var(--green); border-color: var(--green); color: var(--paper); font-weight: 600; }
.btn.go:hover { background: var(--green-2); }
.btn svg { width: 15px; height: 15px; }
.rbar { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; margin: 7px 0; }
.rbar .track { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.rbar .fill { display: block; height: 100%; border-radius: 4px; background: var(--green); transform-origin: left; animation: grow .8s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.rbar span:last-child { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.done { display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 14px 0 8px; }
.done i { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: var(--paper); display: grid; place-items: center; animation: pop .5s var(--spring); }
.done i svg { width: 13px; height: 13px; }
.help td { padding: 6px 14px 6px 0; font-size: 14px; color: var(--ink-2); }
.help td:first-child { white-space: nowrap; }

.toast { position: fixed; top: 18px; left: 50%; z-index: 95; transform: translate(-50%, -14px); opacity: 0; background: var(--dock); color: var(--dock-ink); padding: 9px 14px 9px 10px; border-radius: 12px; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 9px; transition: all .35s var(--spring); pointer-events: none; box-shadow: var(--shadow-2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast i { width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: var(--paper); display: grid; place-items: center; }
.toast i svg { width: 11px; height: 11px; }

@media (max-width: 980px) {
  .stage { grid-template-columns: 1fr; gap: 12px; }
  .col { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding: 4px 28px; margin: 0 -28px; scroll-snap-type: x proximity; }
  .col::-webkit-scrollbar { display: none; }
  .fcard { flex: none; width: 210px; scroll-snap-align: start; }
  .heapbox { height: 340px; }
  .strip { flex-wrap: wrap; }
  .cell { flex: 1 1 30%; border-right: 0; }
  .sort { flex: 1 1 100%; justify-content: center; height: 50px; margin-top: 4px; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .col { padding: 4px 16px; margin: 0 -16px; }
  .fcard { width: 180px; }
  .lib { display: none; }
  .cell .n { font-size: 20px; }
  .cell { padding: 8px 12px; }
  .heap { transform: scale(.85); }
  .lb { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .lb .side { max-height: 50vh; transform: translateY(100%); padding: 20px 18px; }
  .lb .stage2 { padding: 64px 12px 12px; }
  .lb .prev, .lb .next { display: none; }
  .opts { grid-template-columns: 1fr; }
  .grid { gap: 8px; }
  .dock .search { width: calc(100vw - 40px); }
  :root { --tile: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}

<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="/"><i><svg viewBox="0 0 20 20" fill="none" stroke="#F4EEE3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2.4"/><path d="M7 10.2l2.2 2.2L13.4 8"/></svg></i>Cull</a>
    <span class="pill lib" id="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 012-2h4l2 2.2h7a2 2 0 012 2v7.8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg><span></span></span>

    <button class="icon" id="themeBtn" aria-label="Switch theme"></button>

</header>

<div class="wrap">

    <div class="cell"><div class="l">Photos</div><div class="n" id="nPhotos">0</div></div>
    <div class="cell"><div class="l">Videos</div><div class="n" id="nVideos">0</div></div>
    <div class="cell"><div class="l">Sorted into folders</div><div class="n" id="nSorted">0</div></div>
    <div class="cell"><div class="l">Duplicates</div><div class="n" id="nDupes">0<small></small></div></div>
    <button class="sort" id="sortBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9zM19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/></svg><span>Sort</span></button>
  </div>

<script>
/* ======================= setup ======================= */
const ROLES = {
  hook:      { label: "Hook",      key: "h", c: "#7E2320" },
  "a-roll":  { label: "A-roll",    key: "r", c: "#2F5641" },

  reject:    { label: "Reject",    key: "x", c: "#C4594A" },
};
const KEY_ROLE = Object.fromEntries(Object.entries(ROLES).map(([r, v]) => [v.key, r]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HEAP_MAX = 36;

const S = {
  data: null, items: [], byId: new Map(),
  sorted: false, sorting: false, counts: {},

};
const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(b >= 1e8 ? 0 : 1) + " MB";
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const dur = s => { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const orient = i => !i.w || !i.h ? null : i.h > i.w * 1.2 ? "vertical" : i.w > i.h * 1.2 ? "horizontal" : "square";
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967295; };
const isDupe = i => !!i.dup_of;
const ICON = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 012-2h4l2 2.2h7a2 2 0 012 2v7.8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',

function countTo(el, to, fmt = n => Math.round(n).toLocaleString(), ms = 900) {
  const from = +(el.dataset.v || 0);
  el.dataset.v = to;
  if (reduce || from === to) { el.firstChild ? el.firstChild.nodeValue = fmt(to) : el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 4);
    const v = fmt(from + (to - from) * e);
    if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.nodeValue = v; else el.textContent = v;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

}

/* ======================= the sort ======================= */
function flyEl(fromRect, item, toEl, delay, rot) {
  return new Promise(res => {
    const to = $(".fan", toEl).getBoundingClientRect();
    const d = document.createElement("div");
    d.className = "flying";
    d.innerHTML = item.thumb ? `<img src="/thumb/${item.id}" alt="">` : "";
    Object.assign(d.style, { left: fromRect.left + "px", top: fromRect.top + "px", width: fromRect.width + "px", height: fromRect.height + "px" });
    document.body.appendChild(d);
    const dx = to.left + to.width / 2 - (fromRect.left + fromRect.width / 2);
    const dy = to.top + to.height / 2 - (fromRect.top + fromRect.height / 2);
    const s = 34 / fromRect.width;
    const lift = -60 - Math.abs(dx) * .12;
    const a = d.animate([
      { transform: `rotate(${rot}deg) scale(1)`, offset: 0 },
      { transform: `translate(${dx * .5}px, ${dy * .5 + lift}px) rotate(${rot / 2}deg) scale(${(1 + s) / 1.7})`, offset: .5 },
      { transform: `translate(${dx}px, ${dy}px) rotate(0deg) scale(${s})`, opacity: .4, offset: 1 },
    ], { duration: 720, delay, easing: "cubic-bezier(.45,0,.25,1)", fill: "both" });
    a.finished.then(() => { d.remove(); res(); });
  });
}
async function runSort() {

    const item = S.byId.get(el.dataset.id);
    inHeap.add(item.id);
    if (!item.folder) continue;
    const card = cardEl(item.folder); if (!card) continue;
    const rect = el.getBoundingClientRect();
    const rot = parseFloat(getComputedStyle(el).getPropertyValue("--r")) || 0;
    const delay = reduce ? 0 : k * 85;
    k++;
    setTimeout(() => { el.style.visibility = "hidden"; }, delay);
    jobs.push((reduce ? Promise.resolve() : flyEl(rect, item, card, delay, rot)).then(() => {
      addToCard(item.folder, item); blip(fs.indexOf(item.folder)); renderStripCounts();
    }));

  await Promise.all(jobs);

  const rest = live().filter(i => i.folder && !inHeap.has(i.id));

    rest.forEach(i => per[i.folder] = (per[i.folder] || 0) + 1);
    Object.entries(per).forEach(([f, n]) => {
      const el = cardEl(f); if (!el) return;
      S.counts[f] = (S.counts[f] || 0) + n;
      const b = document.createElement("b"); b.dataset.v = S.counts[f] - n;
      const c = $(".c", el); c.innerHTML = ""; c.append(b, ` ${S.counts[f] === 1 ? "file" : "files"}`);
      b.textContent = S.counts[f] - n; countTo(b, S.counts[f], undefined, 700);
      el.classList.remove("zero"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");

  setHeadline(true); renderStrip(); renderFolders(); renderHeap(); renderBrowse(true);
}

  if (idx >= S.limit) { S.limit = idx + 120; renderGrid(false); }
  const id = S.shown[idx].id;
  if (opt.range && S.anchor >= 0) { const [a, b] = [Math.min(S.anchor, idx), Math.max(S.anchor, idx)]; for (let k = a; k <= b; k++) S.selected.add(S.shown[k].id); }
  else if (opt.toggle) { S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); S.anchor = idx; }
  else if (opt.only) { S.selected = new Set([id]); S.anchor = idx; }
  else if (!opt.keep) S.anchor = idx;
  S.focus = idx; marks();
  const el = $(`.tile[data-idx="${idx}"]`);
  if (el && !S.lbOpen) el.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
  if (S.lbOpen) showLightbox(idx, false);
}
function targets() { if (S.selected.size) return [...S.selected]; const f = S.shown[S.focus]; return f ? [f.id] : []; }
function toast(msg) { const t = $("#toast"); $("span", t).textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1700); }
async function change(set, label, ids = targets()) {
  if (!ids.length) return [];
  ids.forEach(id => Object.assign(S.byId.get(id), set));
  post("/api/override", { ids, set });
  toast(`${label} · ${plural(ids.length, "file")}`);
  return ids;
}
function afterEdit() {
  const fid = S.shown[S.focus] && S.shown[S.focus].id;
  S.counts = S.sorted ? folderCounts() : S.counts;
  renderStrip(); renderFolders(); if (S.sorted) renderHeap(); renderBar(); renderGrid(false);
  let ix = S.shown.findIndex(i => i.id === fid); if (ix < 0) ix = Math.min(S.focus, S.shown.length - 1);
  S.focus = ix;
  S.selected = new Set([...S.selected].filter(id => S.shown.some(i => i.id === id)));
  marks();
  if (S.lbOpen) showLightbox(S.focus, false);
}
async function setFolder(f) {
  const ids = targets(); if (!ids.length) return;
  const card = cardEl(f);
  const flights = [];
  if (card && !S.lbOpen && !reduce) {
    const cr = card.getBoundingClientRect();
    if (cr.bottom > 0 && cr.top < innerHeight) {
      ids.slice(0, 12).forEach((id, k) => {
        const t = $(`.tile[data-id="${id}"]`); if (!t) return;
        const r = t.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
        flights.push(flyEl(r, S.byId.get(id), card, k * 50, 0));
      });
    }
  }
  await change({ folder: f }, `Moved to ${f}`, ids);
  await Promise.all(flights);
  if (card) { card.classList.remove("bump"); void card.offsetWidth; card.classList.add("bump"); }
  afterEdit();
}
async function setRole(r) { await change({ role: r }, ROLES[r].label); afterEdit(); }
async function setQuality(q) { await change({ quality: q }, `Quality ${q}/5`); afterEdit(); }
async function toggleStar(ids = targets()) {
  if (!ids.length) return;
  const on = !ids.every(id => S.byId.get(id).starred);
  await change({ starred: on }, on ? "Starred" : "Unstarred", ids);
  ids.forEach(id => { const b = $(`.tile[data-id="${id}"] .starb`); if (b) { b.classList.toggle("on", on); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); } });
  renderBar(); if (S.lbOpen) showLightbox(S.focus, false);
}
async function addTag(tag) {
  tag = tag.trim().toLowerCase(); if (!tag) return;
  for (const id of targets()) { const it = S.byId.get(id); it.tags = [...new Set([...(it.tags || []), tag])]; await post("/api/override", { ids: [id], set: { tags: it.tags } }); }
  toast(`Tagged “${tag}”`);
}

/* ======================= video hover preview ======================= */
let hoverVid = null;
function stopHover() { if (hoverVid) { hoverVid.pause(); hoverVid.removeAttribute("src"); hoverVid.load(); hoverVid.remove(); hoverVid = null; } }
document.addEventListener("mouseover", e => {
  const t = e.target.closest(".tile");
  if (!t) return;
  const it = S.byId.get(t.dataset.id);
  if (!it || it.kind !== "video" || (hoverVid && hoverVid.parentNode === t)) return;
  stopHover();
  const v = document.createElement("video");
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = "auto";
  v.src = `/file/${it.id}#t=${it.hook_at || 0}`;
  v.addEventListener("playing", () => v.classList.add("ok"));
  t.insertBefore(v, t.querySelector(".shade"));
  hoverVid = v; v.play().catch(() => {});
});
document.addEventListener("mouseout", e => {
  const t = e.target.closest(".tile");
  if (t && hoverVid && hoverVid.parentNode === t && !t.contains(e.relatedTarget)) stopHover();
});

/* ======================= lightbox ======================= */
function showLightbox(idx, opening = true) {
  const i = S.shown[idx]; if (!i) return;
  stopHover();
  S.focus = idx; S.lbOpen = true;
  const tile = $(`.tile[data-idx="${idx}"]`);
  const media = $("#media");
  if (i.kind === "video") {
    media.innerHTML = `<video src="/file/${i.id}" controls autoplay muted playsinline poster="${i.thumb ? `/thumb/${i.id}` : ""}"></video>`;
    const v = $("video", media);
    if (i.hook_at) v.addEventListener("loadedmetadata", () => { v.currentTime = i.hook_at; }, { once: true });
  } else {
    media.innerHTML = `<img src="/thumb/${i.id}" alt="${esc(i.caption || i.name)}">`;
    const im = $("img", media), full = new Image();
    full.onload = () => { if (im.isConnected) im.src = full.src; };
    full.src = `/file/${i.id}`;
  }
  const el = media.firstElementChild;
  if (opening && tile && !reduce) {
    requestAnimationFrame(() => {
      const a = tile.getBoundingClientRect(), b = el.getBoundingClientRect();
      if (!b.width) return;
      el.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, borderRadius: "14px" }, { transform: "none", borderRadius: "10px" }], { duration: 480, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  } else if (!reduce) {
    el.animate([{ opacity: 0, transform: "scale(.985)" }, { opacity: 1, transform: "none" }], { duration: 240, easing: "ease-out" });
  }
  const orig = i.dup_of && S.byId.get(i.dup_of), near = i.near_of && S.byId.get(i.near_of);
  const o = orient(i);
  $("#side").innerHTML = `
    <h3>${esc(i.name)}</h3>
    <div class="path">${esc(i.rel)} · ${idx + 1} of ${S.shown.length}</div>
    <p class="caption" ${i.caption ? "" : 'style="color:var(--ink-3)"'}>${esc(i.caption || (i.labelled ? "No caption." : "Not labelled by Claude yet."))}</p>
    ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}
    ${i.kind === "video" && i.sheet ? `<h5>What Claude saw</h5><div class="sheet" id="sheet"><img src="/sheet/${i.id}" alt="Six frames from the clip"><span class="hint2">click a frame to jump</span></div>${i.hook_at != null ? `<button class="hookbtn" id="hookBtn">${ICON.play}Play from the hook · ${i.hook_at.toFixed(1)}s</button>` : ""}` : ""}
    <h5>Role</h5>
    <div class="roles">${Object.entries(ROLES).map(([r, v]) => `<button class="${i.role === r ? "on" : ""}" data-setrole="${r}"><span class="dotc" style="--c:${v.c}"></span>${v.label}<kbd>${v.key}</kbd></button>`).join("")}</div>
    <h5>Folder</h5>
    <div class="selw fsel"><select data-setfolder>${(i.folder ? [] : [`<option value="">Not sorted</option>`]).concat(S.data.folders.map(f => `<option ${i.folder === f ? "selected" : ""}>${esc(f)}</option>`)).join("")}</select></div>
    <h5>Quality</h5>
    <div class="qpick">${[1, 2, 3, 4, 5].map(n => `<button data-setq="${n}" class="${n <= (i.quality || 0) ? "on" : ""}" aria-label="${n} of 5"></button>`).join("")}</div>
    ${(i.tags || []).length ? `<h5>Tags</h5><div class="tags">${i.tags.map(t => `<button data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
    <h5>Details</h5>
    <dl class="kv">
      ${i.kind === "video" ? `<dt>Length</dt><dd>${dur(i.duration)}</dd>` : ""}
      ${i.w ? `<dt>Size</dt><dd>${i.w} × ${i.h}${o ? ` · ${o}` : ""}</dd>` : ""}
      ${i.fps ? `<dt>Frame rate</dt><dd>${i.fps} fps${i.fps >= 90 ? " · slow-mo" : ""}</dd>` : ""}
      ${i.kind === "video" ? `<dt>Audio</dt><dd>${i.audio ? "Yes" : "No"}</dd>` : ""}
      <dt>File</dt><dd>${mb(i.size)}</dd>
      <dt>Date</dt><dd>${new Date(i.mtime * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</dd>
      ${i.blur != null && i.kind === "image" ? `<dt>Sharpness</dt><dd>${Math.round(i.blur)}</dd>` : ""}
      ${i.alpha ? `<dt>Background</dt><dd>Transparent</dd>` : ""}
      ${orig ? `<dt>Copy of</dt><dd>${esc(orig.rel)}</dd>` : ""}
      ${near ? `<dt>Similar to</dt><dd>${esc(near.rel)}</dd>` : ""}
    </dl>
    <div class="hint"><kbd>←</kbd> <kbd>→</kbd> browse &nbsp; <kbd>1</kbd>–<kbd>0</kbd> folder &nbsp; <kbd>s</kbd> star &nbsp; <kbd>esc</kbd> close</div>`;
  const sheet = $("#sheet");
  if (sheet) sheet.onclick = e => {
    const v = $("#media video"); if (!v || !i.frame_times) return;
    const r = sheet.getBoundingClientRect();
    const col = Math.min(2, Math.floor((e.clientX - r.left) / r.width * 3)), row = Math.min(1, Math.floor((e.clientY - r.top) / r.height * 2));
    const t = i.frame_times[row * 3 + col]; if (t != null) { v.currentTime = t; v.play(); }
  };
  const hb = $("#hookBtn");
  if (hb) hb.onclick = () => { const v = $("#media video"); if (v) { v.currentTime = i.hook_at; v.play(); } };
  if (opening) { const lb = $("#lb"); lb.classList.add("show"); lb.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
  marks();
}
function closeLightbox() {
  if (!S.lbOpen) return;
  S.lbOpen = false;
  const lb = $("#lb"); lb.classList.remove("show"); lb.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  const v = $("#media video"); if (v) v.pause();
  setTimeout(() => { if (!S.lbOpen) $("#media").innerHTML = ""; }, 350);
}

/* ======================= modals ======================= */
function openSave() { $("#result").innerHTML = ""; $("#undoBtn").hidden = !S.data.can_undo; $("#saveModal").classList.add("show"); }
function closeModals() { $$(".modal.show").forEach(m => m.classList.remove("show")); }
function showHelp() {
  const rows = [["← → ↑ ↓", "Move between files"], ["Shift + arrows", "Select a range"], ["⌘/Ctrl + click", "Add to the selection"], ["Space", "Big preview (videos play)"], ["1 – 9, 0", "Move to folder 1–10"], ["h  r  b  t  l  k  x", "Hook, A-roll, B-roll, Thumbnail, Brand, Keep, Reject"], ["s", "Star"], ["Shift + A", "Select everything shown"], ["/", "Search"], ["Esc", "Close or clear selection"]];
  $("#helpRows").innerHTML = rows.map(([k, t]) => `<tr><td>${k.split("  ").map(x => `<kbd>${x}</kbd>`).join(" ")}</td><td>${t}</td></tr>`).join("");
  $("#helpModal").classList.add("show");
}
$("#saveGo").onclick = async () => {
  const mode = $("input[name=mode]:checked").value;
  if (mode === "move" && !confirm("Move your original files into the sorted folders? You can undo this once.")) return;
  const btn = $("#saveGo"); btn.disabled = true;
  const r = await post("/api/apply", { mode, skip_rejects: $("#skipRejects").checked, near_as_dupes: $("#nearDupes").checked });
  btn.disabled = false;
  if (!r.ok) { $("#result").innerHTML = `<div class="note">${esc(r.error || "Something went wrong")}</div>`; return; }
  const max = Math.max(1, ...Object.values(r.folders));
  $("#result").innerHTML = `<div class="done"><i>${ICON.check}</i>${r.mode === "move" ? "Moved" : "Copied"} ${plural(r.files, "file")}</div>` +
    Object.entries(r.folders).sort((a, b) => b[1] - a[1]).map(([k, v], ix) => `<div class="rbar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${v / max * 100}%;animation-delay:${ix * 60}ms"></span></span><span>${v}</span></div>`).join("");
  if (r.mode === "move") { $("#undoBtn").hidden = false; await load(); S.counts = folderCounts(); afterEdit(); }
};
$("#undoBtn").onclick = async () => {
  const r = await post("/api/undo", {});
  $("#result").innerHTML = `<div class="done">${r.ok ? `Put ${plural(r.restored, "file")} back.` : esc(r.error)}</div>`;
  $("#undoBtn").hidden = true; await load(); S.counts = folderCounts(); afterEdit();
};

/* ======================= theme & sound ======================= */
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function paintIcons() { $("#themeBtn").innerHTML = isDark() ? ICON.sun : ICON.moon; $("#soundBtn").innerHTML = S.sound ? ICON.soundOn : ICON.soundOff; $("#soundBtn").classList.toggle("on", S.sound); }
$("#themeBtn").onclick = () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; paintIcons(); prefs(true); };
$("#soundBtn").onclick = () => { S.sound = !S.sound; paintIcons(); prefs(true); if (S.sound) blip(4); toast(S.sound ? "Sound on" : "Sound off"); };

/* ======================= events ======================= */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#sortBtn")) return runSort();
  if (t.closest("#replayBtn")) return replay();
  const star = t.closest("[data-star]");
  if (star) { e.stopPropagation(); return toggleStar([star.closest(".tile").dataset.id]); }
  const tile = t.closest(".tile");
  if (tile) {
    const idx = +tile.dataset.idx;
    if (e.shiftKey) return setFocus(idx, { range: true });
    if (e.metaKey || e.ctrlKey) return setFocus(idx, { toggle: true });
    if (S.selected.size > 1) S.selected.clear();
    S.focus = idx; S.anchor = idx; marks();
    return showLightbox(idx);
  }
  const fc = t.closest(".fcard");
  if (fc) {
    const f = fc.dataset.folder;
    S.folder = S.folder === f ? null : f; S.selected.clear(); S.focus = -1; S.limit = 240;
    $$(".fcard").forEach(c => c.classList.toggle("on", c.dataset.folder === S.folder));
    renderBrowse(true);
    if (S.folder !== null) $("#browse").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    return;
  }
  if (t.closest("[data-unfolder]")) { S.folder = null; $$(".fcard").forEach(c => c.classList.remove("on")); return renderBrowse(true); }
  const seg = t.closest("#seg button");
  if (seg) { S.role = seg.dataset.role || null; S.selected.clear(); S.focus = -1; S.limit = 240; $$("#seg button").forEach(b => b.classList.toggle("on", b === seg)); slide(); renderGrid(true); marks(); return; }
  const ty = t.closest("[data-type]");
  if (ty) { S.type = S.type === ty.dataset.type ? null : ty.dataset.type; S.focus = -1; S.selected.clear(); return renderBrowse(true); }
  const vw = t.closest("[data-view]");
  if (vw) { S.view = S.view === vw.dataset.view ? null : vw.dataset.view; S.focus = -1; S.selected.clear(); return renderBrowse(true); }
  if (t.closest("[data-setrole]")) return setRole(t.closest("[data-setrole]").dataset.setrole);
  if (t.closest("[data-setq]")) return setQuality(+t.closest("[data-setq]").dataset.setq);
  const tag = t.closest("[data-tag]");
  if (tag) { closeLightbox(); $("#search").value = tag.dataset.tag; S.q = tag.dataset.tag.toLowerCase(); renderBrowse(true); $("#browse").scrollIntoView({ behavior: "smooth" }); return; }
  if (t.closest("#prev")) return setFocus(S.focus - 1);
  if (t.closest("#next")) return setFocus(S.focus + 1);
  if (t.closest("[data-lbx]") || t.matches("[data-lbclose]")) return closeLightbox();
  if (t.closest("[data-close]")) return closeModals();
  if (t.closest("#helpBtn")) return showHelp();
});
document.addEventListener("change", e => {
  if (e.target.id === "sortSel") { S.sort = e.target.value; prefs(true); renderGrid(true); marks(); }
  if (e.target.matches("[data-setfolder]") && e.target.value) setFolder(e.target.value);
  if (e.target.id === "dockFolder" && e.target.value) { setFolder(e.target.value); e.target.value = ""; }
});
document.addEventListener("input", e => {
  if (e.target.id === "sizeSel") { S.tile = +e.target.value; document.documentElement.style.setProperty("--tile", S.tile + "px"); prefs(true); }
  if (e.target.id === "search") {
    clearTimeout(S._q);
    S._q = setTimeout(() => {
      S.q = e.target.value.trim().toLowerCase(); S.limit = 240; S.focus = -1; renderBrowse(true);
      if (S.q) $("#browse").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    }, 160);
  }
});
$("#dockStar").onclick = () => toggleStar();
$("#dockClear").onclick = () => { S.selected.clear(); marks(); };
$("#dockTag").addEventListener("keydown", e => { if (e.key === "Enter") { addTag(e.target.value); e.target.value = ""; e.target.blur(); } });
$("#searchWrap").addEventListener("click", () => { if (S.selected.size) { S.selected.clear(); marks(); $("#search").focus(); } });
addEventListener("resize", () => slide(false));

document.addEventListener("keydown", e => {
  if (!S.data) return;
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tiles = $$(".tile");
  let cols = 1;
  if (tiles.length > 1) { const y0 = tiles[0].offsetTop; cols = tiles.findIndex(el => el.offsetTop !== y0); if (cols < 1) cols = tiles.length; }
  const f = S.focus;
  const mode = e.shiftKey ? { range: true } : S.selected.size > 1 ? { keep: true } : { only: true };
  switch (e.key) {
    case "ArrowRight": e.preventDefault(); return setFocus(f + 1, mode);
    case "ArrowLeft": e.preventDefault(); return setFocus(Math.max(0, f - 1), mode);
    case "ArrowDown": if (S.lbOpen) return; e.preventDefault(); return setFocus(f < 0 ? 0 : f + cols, mode);
    case "ArrowUp": if (S.lbOpen) return; e.preventDefault(); return setFocus(Math.max(0, f - cols), mode);
    case " ": case "Enter": e.preventDefault(); if (S.lbOpen) return closeLightbox(); return S.focus >= 0 && showLightbox(S.focus);
    case "Escape": if ($(".modal.show")) return closeModals(); if (S.lbOpen) return closeLightbox(); S.selected.clear(); marks(); return;
    case "/": e.preventDefault(); if (S.selected.size) { S.selected.clear(); marks(); } return $("#search").focus();
    case "?": return showHelp();
    case "A": S.shown.slice(0, S.limit).forEach(i => S.selected.add(i.id)); marks(); return;
    case "s": return toggleStar();
  }
  if (/^[0-9]$/.test(e.key)) { const folder = S.data.folders[e.key === "0" ? 9 : +e.key - 1]; if (folder) setFolder(folder); return; }
  if (KEY_ROLE[e.key]) setRole(KEY_ROLE[e.key]);
});

function fillDock() {
  $("#dockFolder").innerHTML = `<option value="">Move to…</option>` + S.data.folders.map((f, k) => `<option value="${esc(f)}">${k < 10 ? (k + 1) % 10 + "  " : ""}${esc(f)}</option>`).join("");
  $("#dockRoles").innerHTML = Object.entries(ROLES).map(([r, v]) => `<button data-setrole="${r}"><span class="dotc" style="--c:${v.c}"></span>${v.label}</button>`).join("");
}

/* ======================= boot ======================= */
prefs(); paintIcons();
document.documentElement.style.setProperty("--tile", S.tile + "px");
load().then(() => {
  fillDock();
  S.sorted = wasSorted() && live().some(i => i.folder);
  S.counts = S.sorted ? folderCounts() : {};
  setHeadline(S.sorted);
  setStatus(S.sorted ? "done" : "idle", S.sorted ? "Sorted" : live().some(i => i.labelled) ? "Ready to sort" : "Waiting for Claude");
  renderStrip(); renderFolders(); renderHeap(); renderBrowse(true);
  // a small replay button next to Sort once sorted
  const rp = document.createElement("button");
  rp.className = "icon replay"; rp.id = "replayBtn"; rp.title = "Sort again (replay)"; rp.innerHTML = ICON.replay;
  rp.style.cssText = "align-self:center;margin:0 4px 0 8px";
  $("#strip").appendChild(rp);
}).catch(err => {
  $("#headline").innerHTML = `Can’t reach <em>Cull.</em>`;
  setStatus("idle", "Offline");
  $("#grid").innerHTML = `<div class="nothing"><b>Is the server running?</b>Start it again from Claude Code. (${esc(err.message)})</div>`;
});
</script>
