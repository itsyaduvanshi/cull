<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoebox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='19' rx='3' fill='%23e8a33d'/%3E%3Crect x='1' y='5' width='30' height='7' rx='2' fill='%23c4781f'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f4f0; --panel: #ffffff; --panel-2: #efece6; --line: #e2ddd4;
  --text: #1d1b18; --muted: #6f6a62; --accent: #c4781f; --accent-soft: #f6e4cb;
  --sel: #2f6fdb; --good: #2e8b57; --bad: #c8453b; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  --check: #e9e6e0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --panel: #1c1b18; --panel-2: #24221f; --line: #33302b;
    --text: #efebe4; --muted: #9a948a; --accent: #e8a33d; --accent-soft: #3a2a14;
    --sel: #5b93f0; --good: #4fbf83; --bad: #e86a5f; --shadow: none; --check: #2a2825;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --panel: #1c1b18; --panel-2: #24221f; --line: #33302b;
  --text: #efebe4; --muted: #9a948a; --accent: #e8a33d; --accent-soft: #3a2a14;
  --sel: #5b93f0; --good: #4fbf83; --bad: #e86a5f; --shadow: none; --check: #2a2825;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; }
.brand small { font-weight: 400; color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.grow { flex: 1; }
.search { width: 240px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 40px; background: var(--panel); }
aside h4 { margin: 18px 10px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
aside h4:first-child { margin-top: 0; }
.nav { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 6px 10px; border: 0; background: none; border-radius: 6px; text-align: left; }
.nav:hover { background: var(--panel-2); }
.nav.on { background: var(--accent-soft); font-weight: 600; }
.nav .k { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; margin-right: 6px; }
.nav .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.ctrl { padding: 4px 10px; }
.ctrl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ctrl select, .ctrl input[type=range] { width: 100%; margin-top: 4px; }
.ctrl select { padding: 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
main { overflow-y: auto; padding: 16px 20px 120px; position: relative; }
.notice { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.notice code { font-size: 12px; }
.section-title { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 8px; font-weight: 600; }
.section-title span { color: var(--muted); font-weight: 400; font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--tile, 170px), 42vw), 1fr)); gap: 10px; }
.tile { position: relative; border-radius: 10px; overflow: hidden; background: var(--panel-2); aspect-ratio: 1; outline: 2px solid transparent; outline-offset: 2px; cursor: pointer; box-shadow: var(--shadow); }
.tile.alpha { background-image: conic-gradient(var(--check) 25%, transparent 0 50%, var(--check) 0 75%, transparent 0); background-size: 16px 16px; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.alpha img { object-fit: contain; padding: 8px; }
.tile.sel { outline-color: var(--sel); }
.tile.focus { outline-color: var(--accent); }
.tile.sel.focus { outline-color: var(--sel); box-shadow: 0 0 0 5px var(--accent-soft); }
.tile.reject img { opacity: .45; filter: grayscale(.6); }
.tile .vid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.badges { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.chip { font-size: 11px; padding: 2px 6px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff; backdrop-filter: blur(4px); white-space: nowrap; }
.chip.role-hero { background: #b8661a; } .chip.role-thumbnail { background: #7b4bc4; } .chip.role-b-roll { background: #2d6c9e; }
.chip.role-brand { background: #2e8b57; } .chip.role-reject { background: #a33a32; } .chip.role-keep { background: rgba(0,0,0,.55); }
.star { position: absolute; top: 6px; right: 8px; color: #ffc53d; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.dupe { position: absolute; top: 6px; left: 6px; }
.dots { margin-left: auto; letter-spacing: 1px; font-size: 10px; color: #ffd27a; text-shadow: 0 1px 2px #000; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: none; gap: 8px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.18); z-index: 20; flex-wrap: wrap; max-width: calc(100vw - 32px); }
.bar.show { display: flex; }
.bar select, .bar input { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); }
.bar .count { font-weight: 600; padding: 0 6px; }
.rolebtn { padding: 5px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; }
.rolebtn:hover { background: var(--panel-2); }
.overlay { position: fixed; inset: 0; background: rgba(10,9,8,.82); display: none; z-index: 40; }
.overlay.show { display: grid; grid-template-columns: 1fr 320px; }
.lb-img { display: grid; place-items: center; padding: 24px; min-height: 0; }
.lb-img img { max-width: 100%; max-height: calc(100vh - 48px); object-fit: contain; border-radius: 6px; }
.lb-side { background: var(--panel); padding: 20px; overflow-y: auto; }
.lb-side h3 { margin: 0 0 4px; font-size: 15px; word-break: break-all; }
.lb-side .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.lb-side p { margin: 0 0 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 13px; margin-bottom: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.modal { position: fixed; inset: 0; background: rgba(10,9,8,.55); display: none; place-items: center; z-index: 50; padding: 16px; }
.modal.show { display: grid; }
.card { background: var(--panel); border-radius: 14px; padding: 22px; width: 460px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.card h3 { margin: 0 0 10px; }
.card .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
.card .opt small { display: block; color: var(--muted); }
.card .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.card .chk { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.result { font-size: 13px; background: var(--panel-2); border-radius: 8px; padding: 10px; margin-top: 10px; display: none; white-space: pre-wrap; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); }
.help td { padding: 3px 10px 3px 0; font-size: 13px; }
.menu-toggle { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { display: none; position: fixed; inset: 0 30% 0 0; z-index: 30; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  aside.open { display: block; }
  .menu-toggle { display: inline-block; }
  header { padding: 10px 16px; }
  main { padding: 12px 16px 140px; }
  .stats { gap: 12px; }
  .search { width: 100%; }
  .overlay.show { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .lb-side { max-height: 45vh; }
  :root { --tile: 110px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="btn menu-toggle" id="menuBtn" aria-label="Folders">☰</button>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="19" rx="3" fill="#e8a33d"/><rect x="1" y="5" width="30" height="7" rx="2" fill="#c4781f"/></svg>
      Shoebox <small id="libName"></small>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grow"></div>
    <input class="search" id="search" placeholder="Search tags, captions, file names   /" autocomplete="off">
    <a class="btn" href="/api/export.csv" title="Download a CSV shot list">Export CSV</a>
    <button class="btn primary" id="applyBtn">Sort into folders</button>
  </header>

  <aside id="side"></aside>

  <main id="main"></main>
</div>

<div class="bar" id="bar">
  <span class="count" id="selCount"></span>
  <select id="barFolder" aria-label="Move to folder"></select>
  <span id="roleBtns"></span>
  <button class="rolebtn" id="starBtn">★ Star</button>
  <input id="tagInput" placeholder="+ tag" size="8">
  <button class="rolebtn" id="clearSel">Clear</button>
</div>

<div class="overlay" id="lb">
  <div class="lb-img" id="lbImg"></div>
  <div class="lb-side" id="lbSide"></div>
</div>

<div class="modal" id="applyModal">
  <div class="card">
    <h3>Sort into folders</h3>
    <p style="color:var(--muted);margin-top:0">Files go to <b id="outPath"></b>, one folder per category. Duplicates go to <b>_Duplicates</b>. Nothing is ever deleted.</p>
    <label class="opt"><input type="radio" name="mode" value="copy" checked><div><b>Copy</b><small>Originals stay where they are. Safest.</small></div></label>
    <label class="opt"><input type="radio" name="mode" value="move"><div><b>Move</b><small>Saves disk space. You can undo the last move.</small></div></label>
    <label class="chk"><input type="checkbox" id="skipRejects" checked> Leave rejects where they are</label>
    <label class="chk"><input type="checkbox" id="nearDupes"> Treat near-duplicates as duplicates</label>
    <div class="result" id="applyResult"></div>
    <div class="row">
      <button class="btn" id="undoBtn" style="display:none">Undo last move</button>
      <div class="grow"></div>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="applyGo">Sort now</button>
    </div>
  </div>
</div>

<div class="modal" id="helpModal">
  <div class="card">
    <h3>Keyboard</h3>
    <table class="help"><tbody id="helpRows"></tbody></table>
    <div class="row"><button class="btn" data-close>Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ROLE_KEYS = { h: "hero", b: "b-roll", t: "thumbnail", l: "brand", k: "keep", x: "reject" };
const ROLE_LABEL = { hero: "Hero", "b-roll": "B-roll", thumbnail: "Thumbnail", brand: "Brand", keep: "Keep", reject: "Reject" };
const state = {
  data: null, items: [], byId: new Map(),
  view: "all", folder: null, role: null, q: "", minQ: 0,
  sort: "folder", tile: 170,
  shown: [], selected: new Set(), focus: -1, anchor: -1, limit: 300,
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = b => (b / 1e6).toFixed(b > 1e8 ? 0 : 1) + " MB";

function prefs(save) {
  try {
    if (save) localStorage.setItem("shoebox.prefs", JSON.stringify({ sort: state.sort, tile: state.tile }));
    else Object.assign(state, JSON.parse(localStorage.getItem("shoebox.prefs") || "{}"));
  } catch (e) {}
}

async function load() {
  const r = await fetch("/api/data");
  state.data = await r.json();
  state.items = state.data.items;
  state.byId = new Map(state.items.map(i => [i.id, i]));
  $("#libName").textContent = state.data.name;
  $("#outPath").textContent = state.data.root + "/Shoebox Sorted";
  renderAll();
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Shoebox": "1" }, body: JSON.stringify(body) });
  return r.json();
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1600);
}

function isDupe(i) { return !!i.dup_of; }
function matches(i) {
  const v = state.view;
  if (v === "unlabelled" && (i.labelled || i.kind !== "image" || isDupe(i))) return false;
  if (v === "starred" && !i.starred) return false;
  if (v === "dupes" && !isDupe(i)) return false;
  if (v === "similar" && !i.near_of && !i.burst) return false;
  if (v === "videos" && i.kind !== "video") return false;
  if (v === "all" && isDupe(i)) return false;
  if (state.folder && i.folder !== state.folder) return false;
  if (state.role && i.role !== state.role) return false;
  if (state.minQ && (i.quality || 0) < state.minQ) return false;
  if (state.q) {
    const hay = [i.rel, i.caption, i.note, i.folder, i.role, ...(i.tags || [])].join(" ").toLowerCase();
    if (!state.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function sorter(a, b) {
  switch (state.sort) {
    case "quality": return (b.quality || 0) - (a.quality || 0) || (b.blur || 0) - (a.blur || 0);
    case "date": return b.mtime - a.mtime;
    case "name": return a.rel.localeCompare(b.rel);
    case "size": return b.size - a.size;
    default: {
      const order = state.data.folders;
      const fa = a.folder ? order.indexOf(a.folder) : 999, fb = b.folder ? order.indexOf(b.folder) : 999;
      return fa - fb || (b.quality || 0) - (a.quality || 0) || a.rel.localeCompare(b.rel);
    }
  }
}

function renderStats() {
  const s = state.data.stats, items = state.items;
  const labelled = items.filter(i => i.labelled).length;
  const images = items.filter(i => i.kind === "image" && !isDupe(i)).length;
  const folders = new Set(items.map(i => i.folder).filter(Boolean)).size;
  const free = items.filter(isDupe).reduce((n, i) => n + i.size, 0);
  $("#stats").innerHTML = [
    [s.files.toLocaleString(), "files"],
    [`${labelled}/${images}`, "labelled by Claude"],
    [folders, "folders"],
    [s.exact_duplicates, "duplicates"],
    [mb(free), "to free up"],
  ].map(([b, t]) => `<div class="stat"><b>${b}</b><span>${t}</span></div>`).join("");
}

function count(fn) { return state.items.filter(fn).length; }

function renderSide() {
  const views = [
    ["all", "All photos", count(i => !isDupe(i))],
    ["starred", "Starred", count(i => i.starred)],
    ["unlabelled", "Not labelled yet", count(i => !i.labelled && i.kind === "image" && !isDupe(i))],
    ["similar", "Similar & bursts", count(i => i.near_of || i.burst)],
    ["dupes", "Exact duplicates", count(isDupe)],
    ["videos", "Videos", count(i => i.kind === "video")],
  ];
  const fcount = f => count(i => i.folder === f && !isDupe(i));
  const rcount = r => count(i => i.role === r && !isDupe(i));
  const folders = state.data.folders;
  $("#side").innerHTML = `
    <h4>Library</h4>
    ${views.map(([k, t, n]) => `<button class="nav ${state.view === k && !state.folder ? "on" : ""}" data-view="${k}"><span>${t}</span><span class="n">${n}</span></button>`).join("")}
    <h4>Folders</h4>
    ${folders.map((f, ix) => `<button class="nav ${state.folder === f ? "on" : ""}" data-folder="${esc(f)}"><span><span class="k">${ix < 10 ? (ix + 1) % 10 : ""}</span>${esc(f)}</span><span class="n">${fcount(f)}</span></button>`).join("")}
    <h4>Edit role</h4>
    ${Object.keys(ROLE_LABEL).map(r => `<button class="nav ${state.role === r ? "on" : ""}" data-role="${r}"><span><span class="k">${Object.keys(ROLE_KEYS).find(k => ROLE_KEYS[k] === r)}</span>${ROLE_LABEL[r]}</span><span class="n">${rcount(r)}</span></button>`).join("")}
    <h4>View</h4>
    <div class="ctrl"><label>Sort by</label>
      <select id="sortSel">${[["folder", "Folder"], ["quality", "Best first"], ["date", "Newest"], ["name", "Name"], ["size", "Largest"]].map(([v, t]) => `<option value="${v}" ${state.sort === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="ctrl"><label>Min quality <span id="qv">${state.minQ || "any"}</span></label><input type="range" id="minQ" min="0" max="5" value="${state.minQ}"></div>
    <div class="ctrl"><label>Tile size</label><input type="range" id="tileSize" min="100" max="320" value="${state.tile}"></div>
    <div class="ctrl" style="margin-top:12px"><button class="btn" id="helpBtn" style="width:100%">Keyboard shortcuts <kbd>?</kbd></button></div>
  `;
}

function tileHTML(i, idx) {
  const cls = ["tile"];
  if (i.alpha) cls.push("alpha");
  if (state.selected.has(i.id)) cls.push("sel");
  if (idx === state.focus) cls.push("focus");
  if (i.role === "reject") cls.push("reject");
  const img = i.kind === "video"
    ? `<div class="vid">▶ ${esc(i.name)}</div>`
    : `<img loading="lazy" src="/thumb/${i.id}" alt="${esc(i.caption || i.name)}">`;
  const q = i.quality ? "●".repeat(i.quality) : "";
  const dup = i.dup_of ? `<span class="chip dupe">duplicate</span>` : i.near_of ? `<span class="chip dupe">similar</span>` : "";
  return `<div class="${cls.join(" ")}" data-idx="${idx}" title="${esc(i.rel)}">${img}${dup}${i.starred ? '<span class="star">★</span>' : ""}
    <div class="badges">${i.role ? `<span class="chip role-${i.role}">${ROLE_LABEL[i.role] || esc(i.role)}</span>` : ""}<span class="dots">${q}</span></div></div>`;
}

function renderGrid() {
  const main = $("#main");
  const list = state.items.filter(matches).sort(sorter);
  state.shown = list;
  if (state.focus >= list.length) state.focus = list.length - 1;
  let html = "";
  const unl = count(i => !i.labelled && i.kind === "image" && !isDupe(i));
  if (unl && state.view === "all" && !state.folder) {
    html += `<div class="notice"><b>${unl} photos are not labelled yet.</b> In Claude Code, run <code>/shoebox ${esc(state.data.root)}</code> again to label them, then reload this page.</div>`;
  }
  if (state.view === "dupes" && list.length) {
    html += `<div class="notice">These are byte-for-byte copies of another photo. "Sort into folders" puts them in <b>_Duplicates</b> so you can delete them yourself.</div>`;
  }
  if (!list.length) {
    main.innerHTML = html + `<div class="empty">Nothing here.</div>`;
    return;
  }
  const shown = list.slice(0, state.limit);
  const groupBy = state.sort === "folder" && !state.folder && state.view !== "dupes";
  if (groupBy) {
    let cur = null, buf = [];
    const flush = () => { if (buf.length) html += `<div class="section-title">${esc(cur || "Not sorted yet")} <span>${list.filter(i => (i.folder || null) === cur).length}</span></div><div class="grid">${buf.join("")}</div>`; buf = []; };
    shown.forEach((i, idx) => { const f = i.folder || null; if (f !== cur) { flush(); cur = f; } buf.push(tileHTML(i, idx)); });
    flush();
  } else {
    html += `<div class="grid">${shown.map(tileHTML).join("")}</div>`;
  }
  if (list.length > state.limit) html += `<div class="empty" id="more">Showing ${state.limit} of ${list.length}…</div>`;
  main.innerHTML = html;
  const more = $("#more");
  if (more) new IntersectionObserver((e, o) => { if (e[0].isIntersecting) { o.disconnect(); state.limit += 300; renderGrid(); } }, { root: main }).observe(more);
}

function renderBar() {
  const n = state.selected.size;
  $("#bar").classList.toggle("show", n > 0);
  $("#selCount").textContent = `${n} selected`;
}

function renderAll() { renderStats(); renderSide(); renderGrid(); renderBar(); }

function setFocus(idx, opts = {}) {
  if (!state.shown.length) return;
  idx = Math.max(0, Math.min(state.shown.length - 1, idx));
  if (idx >= state.limit) { state.limit = idx + 100; }
  const id = state.shown[idx].id;
  if (opts.range && state.anchor >= 0) {
    const [a, b] = [Math.min(state.anchor, idx), Math.max(state.anchor, idx)];
    for (let k = a; k <= b; k++) state.selected.add(state.shown[k].id);
  } else if (opts.toggle) {
    state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
    state.anchor = idx;
  } else if (opts.select) {
    state.selected = new Set([id]); state.anchor = idx;
  }
  state.focus = idx;
  renderGrid(); renderBar();
  const el = document.querySelector(`.tile[data-idx="${idx}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
  if ($("#lb").classList.contains("show")) openLightbox(idx);
}

function targets() {
  if (state.selected.size) return [...state.selected];
  if (state.focus >= 0 && state.shown[state.focus]) return [state.shown[state.focus].id];
  return [];
}

async function change(set, label) {
  const ids = targets();
  if (!ids.length) return;
  const focusId = state.shown[state.focus] && state.shown[state.focus].id;
  ids.forEach(id => Object.assign(state.byId.get(id), set));
  await post("/api/override", { ids, set });
  toast(`${label} · ${ids.length} photo${ids.length > 1 ? "s" : ""}`);
  renderStats(); renderSide(); renderGrid();
  // the photo may have moved to another group: keep focus on the same photo
  const ix = state.shown.findIndex(i => i.id === focusId);
  if (ix >= 0) { state.focus = ix; renderGrid(); }
  renderBar();
  if ($("#lb").classList.contains("show")) openLightbox(state.focus);
}

function setFolder(f) { change({ folder: f }, f); }
function setRole(r) { change({ role: r }, ROLE_LABEL[r]); }
function toggleStar() {
  const ids = targets(); if (!ids.length) return;
  const on = !ids.every(id => state.byId.get(id).starred);
  change({ starred: on }, on ? "Starred" : "Unstarred");
}
function addTag(tag) {
  tag = tag.trim().toLowerCase(); if (!tag) return;
  const ids = targets();
  ids.forEach(async id => {
    const it = state.byId.get(id);
    const tags = [...new Set([...(it.tags || []), tag])];
    it.tags = tags;
    await post("/api/override", { ids: [id], set: { tags } });
  });
  toast(`Tagged "${tag}"`); renderGrid();
}

function openLightbox(idx) {
  const i = state.shown[idx]; if (!i) return;
  state.focus = idx;
  $("#lb").classList.add("show");
  $("#lbImg").innerHTML = i.kind === "video"
    ? `<video src="/file/${i.id}" controls autoplay muted style="max-width:100%;max-height:calc(100vh - 48px)"></video>`
    : `<img src="/file/${i.id}" alt="${esc(i.caption || i.name)}">`;
  const orig = i.dup_of && state.byId.get(i.dup_of);
  const near = i.near_of && state.byId.get(i.near_of);
  $("#lbSide").innerHTML = `
    <h3>${esc(i.name)}</h3>
    <div class="meta">${esc(i.rel)} · ${idx + 1} of ${state.shown.length}</div>
    ${i.caption ? `<p>${esc(i.caption)}</p>` : `<p style="color:var(--muted)">${i.labelled ? "" : "Not labelled by Claude yet."}</p>`}
    ${i.note ? `<p style="color:var(--muted)">${esc(i.note)}</p>` : ""}
    <div class="tags">${(i.tags || []).map(t => `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join("")}</div>
    <dl class="kv">
      <dt>Folder</dt><dd>${esc(i.folder || "—")}</dd>
      <dt>Role</dt><dd>${esc(ROLE_LABEL[i.role] || "—")}</dd>
      <dt>Quality</dt><dd>${i.quality ? "●".repeat(i.quality) + "○".repeat(5 - i.quality) : "—"}</dd>
      <dt>Size</dt><dd>${i.w ? `${i.w}×${i.h} · ` : ""}${mb(i.size)}</dd>
      <dt>Date</dt><dd>${new Date(i.mtime * 1000).toLocaleString()}</dd>
      ${i.blur != null ? `<dt>Sharpness</dt><dd>${Math.round(i.blur)}</dd>` : ""}
      ${i.alpha ? `<dt>Background</dt><dd>Transparent</dd>` : ""}
      ${orig ? `<dt>Copy of</dt><dd>${esc(orig.rel)}</dd>` : ""}
      ${near ? `<dt>Similar to</dt><dd>${esc(near.rel)} (sharper)</dd>` : ""}
    </dl>
    <p style="color:var(--muted);font-size:12px"><kbd>←</kbd> <kbd>→</kbd> browse · <kbd>1</kbd>–<kbd>0</kbd> folder · <kbd>h b t l k x</kbd> role · <kbd>s</kbd> star · <kbd>Esc</kbd> close</p>`;
}
function closeLightbox() { $("#lb").classList.remove("show"); $("#lbImg").innerHTML = ""; }

/* events */
document.addEventListener("click", e => {
  const tile = e.target.closest(".tile");
  if (tile) {
    const idx = +tile.dataset.idx;
    if (e.detail === 2) return openLightbox(idx);
    return setFocus(idx, e.shiftKey ? { range: true } : (e.metaKey || e.ctrlKey) ? { toggle: true } : { select: true });
  }
  const nav = e.target.closest(".nav");
  if (nav) {
    if (nav.dataset.view) { state.view = nav.dataset.view; state.folder = null; state.role = null; }
    if (nav.dataset.folder) { state.folder = state.folder === nav.dataset.folder ? null : nav.dataset.folder; state.view = "all"; }
    if (nav.dataset.role) { state.role = state.role === nav.dataset.role ? null : nav.dataset.role; }
    state.selected.clear(); state.focus = -1; state.limit = 300;
    $("#side").classList.remove("open");
    renderSide(); renderGrid(); renderBar(); $("#main").scrollTop = 0;
    return;
  }
  const tag = e.target.closest(".tag");
  if (tag) { closeLightbox(); $("#search").value = tag.dataset.tag; state.q = tag.dataset.tag.toLowerCase(); renderGrid(); return; }
  if (e.target.closest("[data-close]")) { e.target.closest(".modal").classList.remove("show"); return; }
  if (e.target.id === "lb" || e.target.id === "lbImg") closeLightbox();
  if (e.target.classList.contains("modal")) e.target.classList.remove("show");
  if (e.target.id === "helpBtn") showHelp();
});
document.addEventListener("input", e => {
  if (e.target.id === "minQ") { state.minQ = +e.target.value; $("#qv").textContent = state.minQ || "any"; renderGrid(); }
  if (e.target.id === "tileSize") { state.tile = +e.target.value; document.documentElement.style.setProperty("--tile", state.tile + "px"); prefs(true); }
  if (e.target.id === "search") { state.q = e.target.value.trim().toLowerCase(); state.limit = 300; renderGrid(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "sortSel") { state.sort = e.target.value; prefs(true); renderGrid(); }
  if (e.target.id === "barFolder" && e.target.value) { setFolder(e.target.value); e.target.value = ""; }
});
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");
$("#starBtn").onclick = toggleStar;
$("#clearSel").onclick = () => { state.selected.clear(); renderGrid(); renderBar(); };
$("#tagInput").addEventListener("keydown", e => { if (e.key === "Enter") { addTag(e.target.value); e.target.value = ""; e.target.blur(); } });

function fillBar() {
  $("#barFolder").innerHTML = `<option value="">Move to folder…</option>` + state.data.folders.map(f => `<option>${esc(f)}</option>`).join("");
  $("#roleBtns").innerHTML = Object.keys(ROLE_LABEL).map(r => `<button class="rolebtn" data-setrole="${r}">${ROLE_LABEL[r]}</button>`).join(" ");
  $("#roleBtns").onclick = e => { const b = e.target.closest("[data-setrole]"); if (b) setRole(b.dataset.setrole); };
}

function showHelp() {
  const rows = [
    ["← → ↑ ↓", "Move between photos"], ["Shift + arrows / click", "Select a range"], ["⌘/Ctrl + click", "Add to selection"],
    ["Space / Enter", "Open large preview"], ["1 – 9, 0", "Put in folder 1–10"],
    ["h b t l k x", "Role: hero, b-roll, thumbnail, brand (logo), keep, reject"], ["s", "Star"],
    ["a", "Select all shown"], ["/", "Search"], ["Esc", "Close / clear selection"],
  ];
  $("#helpRows").innerHTML = rows.map(([k, t]) => `<tr><td><kbd>${k}</kbd></td><td>${t}</td></tr>`).join("");
  $("#helpModal").classList.add("show");
}

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const lb = $("#lb").classList.contains("show");
  const cols = Math.max(1, Math.floor(($("#main").clientWidth - 40 + 10) / (state.tile + 10)));
  const f = state.focus < 0 ? 0 : state.focus;
  const shift = e.shiftKey ? { range: true } : { select: !lb && state.selected.size <= 1 };
  switch (e.key) {
    case "ArrowRight": e.preventDefault(); return setFocus(state.focus < 0 ? 0 : f + 1, shift);
    case "ArrowLeft": e.preventDefault(); return setFocus(f - 1, shift);
    case "ArrowDown": if (lb) return; e.preventDefault(); return setFocus(state.focus < 0 ? 0 : f + cols, shift);
    case "ArrowUp": if (lb) return; e.preventDefault(); return setFocus(f - cols, shift);
    case " ": case "Enter": e.preventDefault(); return lb ? closeLightbox() : state.focus >= 0 && openLightbox(state.focus);
    case "Escape":
      if (document.querySelector(".modal.show")) return document.querySelectorAll(".modal.show").forEach(m => m.classList.remove("show"));
      if (lb) return closeLightbox();
      state.selected.clear(); renderGrid(); renderBar(); return;
    case "/": e.preventDefault(); return $("#search").focus();
    case "?": return showHelp();
    case "a": state.shown.forEach(i => state.selected.add(i.id)); renderGrid(); renderBar(); return;
    case "s": return toggleStar();
  }
  if (/^[0-9]$/.test(e.key)) {
    const ix = e.key === "0" ? 9 : +e.key - 1;
    const folder = state.data.folders[ix];
    if (folder) setFolder(folder);
    return;
  }
  if (ROLE_KEYS[e.key]) setRole(ROLE_KEYS[e.key]);
});

/* apply */
$("#applyBtn").onclick = () => {
  $("#applyResult").style.display = "none";
  $("#undoBtn").style.display = state.data.can_undo ? "" : "none";
  $("#applyModal").classList.add("show");
};
$("#applyGo").onclick = async () => {
  const mode = document.querySelector("input[name=mode]:checked").value;
  if (mode === "move" && !confirm("Move your original files into the sorted folders? You can undo this once.")) return;
  $("#applyGo").disabled = true;
  const r = await post("/api/apply", { mode, skip_rejects: $("#skipRejects").checked, near_as_dupes: $("#nearDupes").checked });
  $("#applyGo").disabled = false;
  const box = $("#applyResult"); box.style.display = "block";
  box.textContent = r.ok
    ? `${r.mode === "move" ? "Moved" : "Copied"} ${r.files} files into ${r.out}\n` + Object.entries(r.folders).map(([k, v]) => `  ${k}: ${v}`).join("\n")
    : (r.error || "Something went wrong");
  if (r.mode === "move") { $("#undoBtn").style.display = ""; await load(); }
};
$("#undoBtn").onclick = async () => {
  const r = await post("/api/undo", {});
  const box = $("#applyResult"); box.style.display = "block";
  box.textContent = r.ok ? `Put ${r.restored} files back where they were.` : r.error;
  $("#undoBtn").style.display = "none";
  await load();
};

prefs();
document.documentElement.style.setProperty("--tile", state.tile + "px");
load().then(fillBar).catch(err => { $("#main").innerHTML = `<div class="empty">Could not load the library: ${esc(err.message)}</div>`; });
</script>
</body>
</html>
